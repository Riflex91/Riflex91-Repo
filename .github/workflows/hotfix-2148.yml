name: One-shot 2.14.8 Merchant Atomic Bank Manual Update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2148.yml"
      - "scripts/apply-2.14.8-merchant-atomic-bank-manual-update.py"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 2.14.8 hotfix
        run: python scripts/apply-2.14.8-merchant-atomic-bank-manual-update.py
      - name: Fix exact manual-click smoke marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-2148-merchant-atomic-bank-manual-update.js')
          s=p.read_text(encoding='utf-8')
          old='assert.ok(bot.includes("data-action===\'update-check\'){v2148ManualUpdateInstall();return;"),\'final click wrapper must own update button\');'
          new='assert.ok(bot.includes("t.dataset.action===\'update-check\'){v2148ManualUpdateInstall();return;"),\'final click wrapper must own update button\');'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Merchant stability smoke
        run: node scripts/smoke-merchant-stability.js
      - name: 2.14.4 retained regression smoke
        run: node scripts/smoke-2144-merchant-party-ui.js
      - name: 2.14.5 retained regression smoke
        run: node scripts/smoke-2145-merchant-path-dashboard-ui.js
      - name: 2.14.6 retained regression smoke
        run: node scripts/smoke-2146-merchant-update-button.js
      - name: 2.14.7 retained regression smoke
        run: node scripts/smoke-2147-merchant-bank-item-rules.js
      - name: 2.14.8 atomic bank/manual updater smoke
        run: node scripts/smoke-2148-merchant-atomic-bank-manual-update.js
      - name: Student smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality smoke
        run: node scripts/smoke-quality.js
      - name: Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Cloudflare Worker smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.8 if tests passed
        run: |
          git config user.name "Riflex91"
          git config user.email "hansijuergenlul@gmail.com"
          git add bot.js version.json README.md BOT_README.md scripts/verify-release.js scripts/smoke-merchant-stability.js scripts/smoke-2144-merchant-party-ui.js scripts/smoke-2145-merchant-path-dashboard-ui.js scripts/smoke-2146-merchant-update-button.js scripts/smoke-2147-merchant-bank-item-rules.js scripts/smoke-2148-merchant-atomic-bank-manual-update.js
          git commit -m "Release 2.14.8: Merchant state machine and manual updater"
          git push origin main
