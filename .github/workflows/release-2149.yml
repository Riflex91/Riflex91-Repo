name: Release 2.14.9 Merchant Warehouse Discovery

on:
  push:
    branches:
      - hotfix/2.14.9-merchant-bank-discovery

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[release-2149]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 2.14.9 patch
        run: python3 scripts/patch-2149.py
      - name: Fix generated smoke assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-2149-bank-discovery.js')
          s=p.read_text()
          bad='assert.ok(bot.includes("v2147ItemPolicy(it.name))>=0")||bot.includes("[\'bank\',\'sell\',\'exchange\'].indexOf(v2147ItemPolicy"),\'bank staging must respect explicit bank/sell/exchange disposition\');'
          good='assert.ok(bot.includes("[\'bank\',\'sell\',\'exchange\'].indexOf(v2147ItemPolicy"),\'bank staging must respect explicit bank/sell/exchange disposition\');'
          if bad in s: s=s.replace(bad,good)
          p.write_text(s)
          PY
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Retained smoke tests
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Diff sanity
        run: git diff --check
      - name: Commit tested release
        run: |
          rm -f scripts/patch-2149.py .github/workflows/release-2149.yml
          git config user.name "aio-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release 2.14.9: Merchant warehouse and active discovery [release-2149]"
          git push origin HEAD:hotfix/2.14.9-merchant-bank-discovery
