name: Mewthisch Guides 1.0

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides1/**"
      - ".github/workflows/mewthisch-guides-1.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides1/**"
      - ".github/workflows/mewthisch-guides-1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides1" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate login bootstrap contract
        run: |
          lua5.1 - <<'LUA'
          UnitClass=function() return "Mage","MAGE",8 end
          UnitRace=function() return "Human","Human",1 end
          UnitLevel=function() return 12 end
          UnitFactionGroup=function() return "Alliance" end

          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides1/Core/Namespace.lua"))("MewthischGuides1",MG)
          local db=MG:EnsureDB()
          assert(type(db.guide)=="table","db.guide must exist before login guide selection")
          assert(type(db.ui)=="table","db.ui must exist")
          local p=MG:GetPlayerProfile()
          assert(p.class=="MAGE" and p.classID==8,"class multi-return lost")
          assert(p.race=="Human" and p.raceID==1,"race multi-return lost")
          assert(p.level==12 and p.faction=="Alliance")
          print("Login bootstrap contract PASS")
          LUA

      - name: Validate Forever UI compatibility fallbacks
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides1/Core/UICompat.lua"))("MewthischGuides1",MG)

          local frame={calls={}}
          function frame:SetWidth(v) self.calls.width=v end
          function frame:SetHeight(v) self.calls.height=v end
          function frame:Show() self.calls.shown=true end
          function frame:Hide() self.calls.shown=false end
          MG.UICompat:SetSize(frame,430,430)
          assert(frame.calls.width==430 and frame.calls.height==430)
          MG.UICompat:SetShown(frame,true);assert(frame.calls.shown==true)
          MG.UICompat:SetShown(frame,false);assert(frame.calls.shown==false)

          local tex={calls={}}
          function tex:SetTexture(...) self.calls.texture={...} end
          function tex:SetVertexColor(...) self.calls.color={...} end
          MG.UICompat:SetSolid(tex,.1,.2,.3,.4)
          assert(tex.calls.texture,"legacy texture fallback missing")
          print("Forever UI compatibility PASS")
          LUA

      - name: Validate recovery does not jump to future turn-in
        run: |
          lua5.1 - <<'LUA'
          local MG={QuestFacts={},InventoryFacts={}}
          assert(loadfile("world of warcraft/MewthischGuides1/Guide/RecoveryPolicy.lua"))("MewthischGuides1",MG)

          local guide={steps={
            {id="objective",goals={{
              id="g1",action="complete",questID=750,objectiveIndex=1,
            }}},
            {id="other",goals={}},
            {id="turnin",goals={{
              id="g2",action="turnin",questID=750,
            },{
              id="g3",action="accept",questID=780,
            }}},
          }}

          local facts={quests={
            [750]={
              active=true,completed=false,readyForTurnIn=false,
              objectives={[1]={finished=false,current=2,required=10}},
            },
          },inventory={}}

          local index,reason=MG.RecoveryPolicy:FindResumeIndex(guide,facts)
          assert(index==1,
            "active unfinished objective must win over later turn-in, got "..tostring(index))
          assert(reason=="unfinished_objective",
            "unexpected recovery reason "..tostring(reason))

          facts.quests[750].objectives[1].finished=true
          facts.quests[750].readyForTurnIn=true
          local turninIndex,turninReason=MG.RecoveryPolicy:FindResumeIndex(guide,facts)
          assert(turninIndex==3,
            "ready quest must recover to turn-in step")
          assert(turninReason=="ready_turnin")
          print("Recovery actionable-goal ordering PASS")
          LUA

      - name: Validate named RestedXP waypoint distance
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          C_Map=nil
          assert(loadfile("world of warcraft/MewthischGuides1/Navigation/Distance.lua"))("MewthischGuides1",MG)
          local d,mode=MG.NavigationDistance:Between(
            {mapID=7,mapName="Mulgore",x=.44,y=.78},
            {mapName="Mulgore",x=.4492,y=.7712})
          assert(d and d>0)
          assert(mode=="normalized_map_distance")
          local none,reason=MG.NavigationDistance:Between(
            {mapID=7,mapName="Mulgore",x=.44,y=.78},
            {mapName="Durotar",x=.44,y=.78})
          assert(none==nil and reason=="different_map_name")
          print("Named RestedXP waypoint distance PASS")
          LUA

      - name: Validate presentation does not duplicate quest progress
        run: |
          lua5.1 - <<'LUA'
          local MG={RestEDXPActionCatalog=nil}
          C_QuestLog=nil
          assert(loadfile("world of warcraft/MewthischGuides1/Core/Namespace.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Presentation/PresentationResolver.lua"))("MewthischGuides1",MG)
          local state={
            id="g1",action="complete",questID=750,objectiveIndex=1,
            current=2,required=10,status="incomplete",completionKnown=true,
            sourceGoal={},
          }
          local facts={quests={[750]={
            title="Die Jagd geht weiter",
            objectives={[1]={text="Bergpumapelz: 2/10"}},
          }}}
          local row=MG.PresentationResolver:GoalRow(state,facts,"step")
          assert(row.text=="Bergpumapelz: 2/10")
          assert(row.progress==nil,"progress must not duplicate 2/10 already in objective text")
          print("Presentation duplicate-progress regression PASS")
          LUA

      - name: Validate navigator bearing directions
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides1/Navigation/Bearing.lua"))("MewthischGuides1",MG)
          local B=MG.NavigationBearing
          local p={mapID=7,mapName="Mulgore",x=.50,y=.50}
          local north=B:Resolve(p,{mapID=7,x=.50,y=.40},0)
          local east=B:Resolve(p,{mapID=7,x=.60,y=.50},0)
          local south=B:Resolve(p,{mapID=7,x=.50,y=.60},0)
          local west=B:Resolve(p,{mapID=7,x=.40,y=.50},0)
          assert(north and math.abs(north.relative) < 0.0001)
          assert(east and east.relative < -1.5 and east.relative > -1.7)
          assert(south and math.abs(math.abs(south.relative)-math.pi) < 0.0001)
          assert(west and west.relative > 1.5 and west.relative < 1.7)
          local noFacing=B:Resolve(p,{mapID=7,x=.50,y=.40},nil)
          assert(noFacing and not noFacing.reliable and noFacing.relative==nil)
          print("Navigator bearing PASS")
          LUA

      - name: Validate navigator preserves distance mode return
        run: |
          set -euo pipefail
          NAV="world of warcraft/MewthischGuides1/UI/NavigatorFrame.lua"
          grep -q 'MG.NavigationDistance:Between(position, nav.waypoint)' "$NAV"
          if grep -q 'distance, distanceMode = MG.NavigationDistance and' "$NAV"; then
            echo "multi-return value would be collapsed by logical-and expression" >&2
            exit 1
          fi
          grep -q 'NavigationBearing:Resolve' "$NAV"
          echo "Navigator multi-return contract PASS"

      - name: Validate Forever RestedXP absolute world-coordinate navigation
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          CreateVector2D=function(x,y) return {x=x,y=y} end
          C_Map={}
          C_Map.GetWorldPosFromMapPos=function(mapID,point)
            assert(mapID==1412)
            assert(point.x and point.y)
            return 1,{x=-300.0,y=-3300.0}
          end

          assert(loadfile("world of warcraft/MewthischGuides1/Navigation/Distance.lua"))(
            "MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Navigation/Bearing.lua"))(
            "MewthischGuides1",MG)

          local position={
            mapID=1412,mapName="Mulgore",
            x=0.4444275498390198,y=0.7803714275360107,
          }
          local waypoint={
            mapID=1412,mapName="1412/1",floor=1,radius=50,
            worldX=-243.41,worldY=-3384.87,source="RestedXP",
          }

          local distance,mode,detail=MG.NavigationDistance:Between(position,waypoint)
          assert(distance and distance>100 and distance<103,
            "unexpected RestedXP world distance "..tostring(distance))
          assert(mode=="restedxp_world_coordinates",
            "wrong distance mode "..tostring(mode))
          assert(detail and detail.playerWorld and detail.targetWorld)

          local bearing,reason=MG.NavigationBearing:Resolve(
            position,waypoint,2.712008476257324)
          assert(bearing and bearing.reliable,
            "world-coordinate bearing unavailable: "..tostring(reason))
          assert(bearing.reason=="restedxp_world_coordinates")
          assert(type(bearing.relative)=="number")
          assert(type(bearing.absolute)=="number")
          print("Forever RestedXP world-coordinate navigation PASS")
          LUA

      - name: Validate compact player-facing GUI contract
        run: |
          set -euo pipefail
          NAV="world of warcraft/MewthischGuides1/UI/NavigatorFrame.lua"
          VIEW="world of warcraft/MewthischGuides1/UI/GuideViewer.lua"
          NS="world of warcraft/MewthischGuides1/Core/Namespace.lua"

          grep -q 'restedxp_world_coordinates' "$NAV"
          grep -q 'UI-HUD-Minimap-Arrow-Player' "$NAV"
          grep -q 'bearing.relative + TEXTURE_ZERO_OFFSET' "$NAV"
          grep -q 'UI:SetSize(frame, 150, 112)' "$NAV"

          grep -q 'FRAME_WIDTH = 390' "$VIEW"
          grep -q 'Zusätzliche Ziele' "$VIEW"
          grep -q 'showViewer = false' "$VIEW"
          grep -q 'viewerX' "$VIEW"
          grep -q 'viewerY' "$VIEW"

          grep -q '2026-09-22-worldnav-ui-2' "$NS"

          if grep -q 'Runtime " .. tostring(runtime.revision' "$VIEW"; then
            echo "runtime debug revision leaked into player-facing viewer" >&2
            exit 1
          fi
          if grep -q 'Richtung ?' "$NAV"; then
            echo "obsolete direction placeholder leaked into navigator" >&2
            exit 1
          fi
          echo "Compact player-facing GUI contract PASS"

      - name: Validate RestedXP raw-step preservation
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides1/Core/Namespace.lua"))("MewthischGuides1",MG)
          MG.db={settings={rxpSeason=0,rxpRate=1,rxpHardcoreMode=false,rxpSoDMode=false}}
          for i=1,5 do
            assert(loadfile(string.format(
              "world of warcraft/MewthischGuides1/Data/RestedXPForeverData_%02d.lua",i)))(
              "MewthischGuides1",MG)
          end
          assert(loadfile("world of warcraft/MewthischGuides1/Data/RestedXPActionCatalog.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Guide/RestedXPParser.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Guide/GuideCompiler.lua"))("MewthischGuides1",MG)

          local raw=MG.RestEDXPParser:Parse()
          local compiled=MG.GuideCompiler:CompileAll()
          local rawSteps,compiledSteps,sticky=0,0,0
          for _,g in ipairs(raw) do rawSteps=rawSteps+#(g.steps or {}) end
          for _,g in ipairs(compiled) do
            compiledSteps=compiledSteps+#(g.steps or {})
            for _,s in ipairs(g.steps or {}) do if s.sticky then sticky=sticky+1 end end
          end
          assert(#raw==#compiled,"guide count changed in compiler")
          assert(rawSteps==compiledSteps,"RestedXP raw-step boundaries were lost")
          assert(rawSteps>12000,"unexpectedly small RestedXP corpus")
          assert(sticky>0,"sticky semantics not detected")
          assert(MG.GuideCompiler:GetStats().levelCapAssumption==false)
          print("RestedXP semantic compile PASS",#raw,rawSteps,sticky)
          LUA

      - name: Validate multi-goal and hidden blocker semantics
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={showCompletedGoals=false,showPassiveHints=true}}}
          MG.GetPlayerProfile=function() return {level=10,class="MAGE",race="Human",faction="Alliance"} end
          MG.RestedXPSelector={
            Matches=function() return true,"ok" end,
            TagsMatch=function() return true,"ok" end,
          }
          assert(loadfile("world of warcraft/MewthischGuides1/Resolver/RequirementResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Resolver/VisibilityResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Resolver/CompletionResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Resolver/GoalStateResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Resolver/StepStateResolver.lua"))("MewthischGuides1",MG)

          local facts={quests={
            [10]={active=true,completed=false,objectives={
              [1]={finished=false,current=2,required=8},
              [2]={finished=false,current=1,required=5},
            }},
          },inventory={}}
          local base={role="goal",passive=false,optional=false,visibleByDefault=true,
            requirements={stepSelector="",actionSelector="",tags={}},questID=10}
          local g1={};for k,v in pairs(base) do g1[k]=v end
          g1.id="g1";g1.action="complete";g1.completionKind="quest_objective";g1.objectiveIndex=1
          local g2={};for k,v in pairs(base) do g2[k]=v end
          g2.id="g2";g2.action="complete";g2.completionKind="quest_objective";g2.objectiveIndex=2
          local condition={id="c1",role="condition",passive=false,optional=false,
            visibleByDefault=false,requirements={stepSelector="",actionSelector="",tags={}},
            action="isOnQuest",completionKind="quest_active",questID=10}

          local states={
            MG.GoalStateResolver:Resolve(g1,facts),
            MG.GoalStateResolver:Resolve(g2,facts),
            MG.GoalStateResolver:Resolve(condition,facts),
          }
          assert(states[1].visible and states[2].visible)
          assert(not states[3].visible and states[3].blocking and states[3].complete)
          local step=MG.StepStateResolver:Resolve({id="s"},states,nil)
          assert(step.blockingGoals==3)
          assert(not step.complete)
          print("Multi-goal + hidden blocker PASS")
          LUA

      - name: Validate runtime revision and transition rules
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides1/Runtime/RuntimeStore.lua"))("MewthischGuides1",MG)
          assert(loadfile("world of warcraft/MewthischGuides1/Runtime/TransitionDetector.lua"))("MewthischGuides1",MG)

          local first=MG.RuntimeStore:Commit({
            stepID="s1",
            goalStates={{id="g1",complete=true,visible=true,current=1,required=1}},
            stickies={},
            stepState={complete=false},
          })
          assert(first.revision==1)
          local initial=MG.TransitionDetector:Detect(nil,first)
          assert(#initial==0,"initial complete state must not emit transition")

          local second=MG.RuntimeStore:Commit({
            stepID="s1",
            goalStates={{id="g1",complete=true,visible=true,current=1,required=1},
                        {id="g2",complete=false,visible=true,current=1,required=5}},
            stickies={},
            stepState={complete=false},
          })
          assert(second.revision==2)
          local third=MG.RuntimeStore:Commit({
            stepID="s1",
            goalStates={{id="g1",complete=true,visible=true,current=1,required=1},
                        {id="g2",complete=true,visible=true,current=5,required=5}},
            stickies={},
            stepState={complete=true},
          })
          local events=MG.TransitionDetector:Detect(second,third)
          local completed,stepComplete=false,false
          for _,e in ipairs(events) do
            if e.type=="GOAL_COMPLETED" and e.goalID=="g2" then completed=true end
            if e.type=="STEP_COMPLETE" then stepComplete=true end
          end
          assert(completed and stepComplete)
          assert(third.revision==3)
          print("Runtime revision + transitions PASS")
          LUA

      - name: Validate TOC contract
        run: |
          set -euo pipefail
          TOC="world of warcraft/MewthischGuides1/MewthischGuides1.toc"
          grep -q 'Guide/GuideCompiler.lua' "$TOC"
          grep -q 'Runtime/RuntimeStore.lua' "$TOC"
          grep -q 'Resolver/StepStateResolver.lua' "$TOC"
          grep -q 'UI/ErrorLogWindow.lua' "$TOC"
          grep -q 'Core/Bootstrap.lua' "$TOC"
          grep -q 'desiredHeight' "world of warcraft/MewthischGuides1/UI/GuideViewer.lua"
          grep -q 'unfinished_objective' "world of warcraft/MewthischGuides1/Guide/RecoveryPolicy.lua"


      - name: Build installable addon ZIP
        run: |
          cd "world of warcraft"
          zip -r "$GITHUB_WORKSPACE/MewthischGuides1.zip" MewthischGuides1

      - name: Upload installable addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides1-installable
          path: MewthischGuides1.zip
          if-no-files-found: error
