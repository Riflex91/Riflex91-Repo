name: v5-bank-function-test-gui

on:
  pull_request:
    paths:
      - 'v5/werkzeuge/bank-function-test-**'
      - 'v5/werkzeuge/v5-adventure-land-test-gui.js'
      - 'v5/werkzeuge/tests/bank-function-test-gui.test.mjs'
      - 'v5/dokumentation/V5-BANK-FUNKTIONSTEST-GUI.md'
      - 'v5/dokumentation/DIREKTE-INGAME-TESTS.md'
      - 'v5/dokumentation/PR20-2-BANK-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/roadmap/pr20-2-bank-direct-ingame-function-evidence.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/grundlage/tests/pr20-bank-direct-ingame-function-evidence.test.mjs'
      - 'v5/grundlage/quelle/merchant/bank-open-pack-settlement.ts'
      - 'v5/grundlage/vertraege/runtime/bank-open-pack-production-candidate.json'
      - 'v5/grundlage/tests/pr20-bank-open-pack-settlement.test.mjs'
      - 'v5/roadmap/pr20-2-bank-open-pack-shadow-evidence.json'
      - 'v5/roadmap/pr20-2-bank-open-pack-admission-evidence.json'
      - 'v5/grundlage/tests/pr20-bank-open-pack-admission-evidence.test.mjs'
      - 'v5/architektur/adr/ADR-048-PR20-2T-BANK-OPEN-PACK-SHADOW-SETTLEMENT-NO-WRITE.md'
      - 'v5/grundlage/vertraege/runtime/bank-production-preparation.json'
      - 'v5/package.json'
      - '.github/workflows/v5-bank-function-test-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - working-directory: v5
        run: npm ci
      - working-directory: v5
        run: npm run bank-function-test-gui:pruefen
      - working-directory: v5
        run: npm run bank-open-pack-shadow:pruefen
