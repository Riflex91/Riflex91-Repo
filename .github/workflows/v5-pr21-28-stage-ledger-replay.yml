name: v5-pr21-28-stage-ledger-replay
on:
  push:
    paths:
      - 'v5/grundlage/quelle/runtime/pr21-28-stage-state-ledger.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-gate-settlement-rollback.ts'
      - 'v5/grundlage/vertraege/runtime/pr21-28-gate-settlement-rollback.json'
      - 'v5/grundlage/quelle/runtime/cap022-foundation-chain-readiness.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-feature-gates.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-shadow-orchestrator.ts'
      - 'v5/grundlage/tests/pr21-28-orchestration.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-accelerated-orchestration.json'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-stage-ledger-replay.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-stage-ledger-replay.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - '.github/workflows/v5-pr21-28-stage-ledger-replay.yml'
  pull_request:
    paths:
      - 'v5/grundlage/quelle/runtime/pr21-28-stage-state-ledger.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-gate-settlement-rollback.ts'
      - 'v5/grundlage/vertraege/runtime/pr21-28-gate-settlement-rollback.json'
      - 'v5/grundlage/quelle/runtime/cap022-foundation-chain-readiness.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-feature-gates.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-shadow-orchestrator.ts'
      - 'v5/grundlage/tests/pr21-28-orchestration.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-accelerated-orchestration.json'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-stage-ledger-replay.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-stage-ledger-replay.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - '.github/workflows/v5-pr21-28-stage-ledger-replay.yml'
permissions:
  contents: read
jobs:
  stage-ledger-replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - run: npm ci
      - run: npm run bauen
      - run: node --test grundlage/tests/pr21-28-stage-ledger-replay.test.mjs
      - run: node --test grundlage/tests/pr21-28-gate-settlement-rollback.test.mjs grundlage/tests/pr21-28-default-off-gate-apply.test.mjs grundlage/tests/pr21-28-ratification-gate-proposals.test.mjs
      - run: npm run post-pr20-foundations:pruefen
