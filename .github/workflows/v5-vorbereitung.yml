name: v5-vorbereitung

on:
  pull_request:
    paths:
      - 'v5/anforderungen/**'
      - 'v5/gefahren/**'
      - 'v5/invarianten/**'
      - 'v5/zustaende/**'
      - 'v5/fitness/**'
      - 'v5/bereitschaft/**'
      - 'v5/entwicklungsregeln/**'
      - 'v5/anzeigetexte/**'
      - 'v5/dokumentation/VOR-RUNTIME-SPEZIFIKATION.md'
      - 'v5/dokumentation/WISSENSWAECHTER-VERTRAG.md'
      - 'v5/dokumentation/ENTWICKLUNGS-WISSENSGATE.md'
      - 'v5/dokumentation/LIVE-WISSEN-SSD-VERTRAG.md'
      - 'v5/dokumentation/GESAMTFREIGABE.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - 'v5/README.md'
      - '.github/workflows/v5-gesamtfreigabe.yml'
      - 'v5/wissensbasis/live/**'
      - 'v5/dokumentation/DEUTSCHE_NAMEN_UND_NARRENSICHERHEIT.md'
      - 'v5/roadmap/r0-r3-reconciliation.json'
      - 'v5/roadmap/windows-bridge-readiness-testprofil.json'
      - 'v5/roadmap/v5-wissen-012-autorisierungsnachweis.json'
      - 'v5/roadmap/gesamtfreigabe-vorbereitung.json'
      - 'v5/roadmap/gesamtfreigabe.json'
      - 'v5/werkzeuge/r0-r3-reconciliation-pruefen.mjs'
      - 'v5/werkzeuge/gesamtfreigabe-pruefen.mjs'
      - 'v5/grundlage/quelle/anzeige/uebersetzungsaufgaben.ts'
      - 'ops/windows-bridge/WebQuellenEntdecker.cs'
      - 'ops/windows-bridge/WissenswaechterDienst.cs'
      - 'ops/windows-bridge/GitHubAnmeldung.cs'
      - 'ops/windows-bridge/GitArbeitskopie.cs'
      - 'ops/windows-bridge/V5ReadinessSystemtest.cs'
      - 'ops/windows-bridge/MainWindow.xaml'
      - 'ops/windows-bridge/MainWindow.xaml.cs'
      - 'ops/windows-bridge/README.md'
      - 'ops/windows-bridge-tests/Program.cs'
      - 'v5/werkzeuge/vorbereitung-pruefen.mjs'
      - '.github/workflows/v5-vorbereitung.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/anforderungen/**'
      - 'v5/gefahren/**'
      - 'v5/invarianten/**'
      - 'v5/zustaende/**'
      - 'v5/fitness/**'
      - 'v5/bereitschaft/**'
      - 'v5/entwicklungsregeln/**'
      - 'v5/dokumentation/LIVE-WISSEN-SSD-VERTRAG.md'
      - 'v5/dokumentation/GESAMTFREIGABE.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - 'v5/README.md'
      - '.github/workflows/v5-gesamtfreigabe.yml'
      - 'v5/wissensbasis/live/**'
      - 'v5/anzeigetexte/**'
      - 'v5/roadmap/r0-r3-reconciliation.json'
      - 'v5/roadmap/windows-bridge-readiness-testprofil.json'
      - 'v5/roadmap/v5-wissen-012-autorisierungsnachweis.json'
      - 'v5/roadmap/gesamtfreigabe-vorbereitung.json'
      - 'v5/roadmap/gesamtfreigabe.json'
      - 'v5/werkzeuge/r0-r3-reconciliation-pruefen.mjs'
      - 'v5/werkzeuge/gesamtfreigabe-pruefen.mjs'
      - 'v5/grundlage/quelle/anzeige/uebersetzungsaufgaben.ts'
      - 'ops/windows-bridge/WebQuellenEntdecker.cs'
      - 'ops/windows-bridge/WissenswaechterDienst.cs'
      - 'ops/windows-bridge/GitHubAnmeldung.cs'
      - 'ops/windows-bridge/GitArbeitskopie.cs'
      - 'ops/windows-bridge/V5ReadinessSystemtest.cs'
      - 'ops/windows-bridge/MainWindow.xaml'
      - 'ops/windows-bridge/MainWindow.xaml.cs'
      - 'ops/windows-bridge/README.md'
      - 'ops/windows-bridge-tests/Program.cs'
      - 'v5/werkzeuge/vorbereitung-pruefen.mjs'

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V5 Vor-Runtime-Artefakte pruefen
        run: node v5/werkzeuge/vorbereitung-pruefen.mjs
