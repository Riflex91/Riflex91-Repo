name: v5-vorbereitung

# Manuelle Offline-Diagnose; keine automatische Gameplay-Freigabe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-offline-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vorbereitung diagnostizieren
        run: node v5/werkzeuge/vorbereitung-pruefen.mjs
