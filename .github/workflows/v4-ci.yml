name: v4-ci

on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'
  pull_request:
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and architecture checks
        run: npm run check
