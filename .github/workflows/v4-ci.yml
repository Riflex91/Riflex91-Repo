name: v4-foundation-ci

on:
  push:
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'

permissions:
  contents: read

jobs:
  v4-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install V4 foundation dependencies
        working-directory: v4
        run: npm install --ignore-scripts
      - name: Typecheck, unit tests and structure guard
        working-directory: v4
        run: npm run check
