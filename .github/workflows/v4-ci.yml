name: v4-ci

on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'cloudflare-dashboard/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/v4-ci.yml'
      - '.github/workflows/v4-pruefung.yml'
  pull_request:
    paths:
      - 'v4/**'
      - 'cloudflare-dashboard/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/v4-ci.yml'
      - '.github/workflows/v4-pruefung.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grundlage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V4-Abhaengigkeiten installieren
        run: npm install --ignore-scripts
      - name: Typen, Tests, Namen und Struktur pruefen
        run: npm run pruefen
      - name: Cloudflare Runtime-Release und Worker pruefen
        working-directory: cloudflare-dashboard
        run: npm run check
