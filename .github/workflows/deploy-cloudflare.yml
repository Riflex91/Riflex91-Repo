# deployment-check: secrets configured
name: deploy-cloudflare
on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-dashboard/**"
      - "v3/**"
      - "v4/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact release commit to deploy; defaults to the triggering SHA"
        required: false
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: "Exact release commit to deploy"
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build V3 bootstrap and runtime artifacts
        working-directory: v3
        run: node scripts/build.js
      - name: Install V4 build dependencies
        working-directory: v4
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build and verify V4 production runtime artifacts
        working-directory: v4
        shell: bash
        run: |
          set -euo pipefail
          npm run produktions-runtime:bauen
          test -s dist/aio-v4-runtime.js
          test -s dist/aio-v4-runtime.sha256
          expected_sha="$(tr -d '[:space:]' < dist/aio-v4-runtime.sha256)"
          actual_sha="$(sha256sum dist/aio-v4-runtime.js | awk '{print $1}')"
          [ "${#expected_sha}" -eq 64 ] || { echo "V4 runtime SHA-256 file must contain exactly 64 hex characters." >&2; exit 1; }
          case "$expected_sha" in *[!0-9a-f]*) echo "V4 runtime SHA-256 file contains invalid characters." >&2; exit 1 ;; esac
          [ "$actual_sha" = "$expected_sha" ] || { echo "Local V4 runtime SHA-256 mismatch." >&2; exit 1; }
      - name: Validate Worker source and R2 log policy tests
        working-directory: cloudflare-dashboard
        run: npm run check
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets once to enable automatic deploys."
          fi
      - name: Install Cloudflare tooling
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        run: npm install --ignore-scripts
      - name: Discover D1 database and prepare deploy config
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        run: |
          npx wrangler d1 list --json > d1-list.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('d1-list.json','utf8'));
          const db=(Array.isArray(rows)?rows:[]).find(x=>x&&x.name==='aio-bot-dashboard');
          if(!db||!db.uuid) throw new Error('D1 database aio-bot-dashboard was not found for this Cloudflare account');
          const src=fs.readFileSync('wrangler.jsonc','utf8');
          if(!src.includes('REPLACE_WITH_D1_DATABASE_ID')) throw new Error('Expected D1 placeholder not found');
          fs.writeFileSync('wrangler.deploy.jsonc',src.replace('REPLACE_WITH_D1_DATABASE_ID',db.uuid));
          NODE
          rm -f d1-list.json
      - name: Check R2 log bucket
        id: r2
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        run: |
          if npx wrangler r2 bucket info aio-v3-logs --config wrangler.deploy.jsonc >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped because R2 bucket aio-v3-logs does not exist yet. Create it with: npx wrangler r2 bucket create aio-v3-logs"
          fi
      - name: Enforce seven-day R2 log lifecycle
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        run: |
          npx wrangler r2 bucket lifecycle remove aio-v3-logs --id aio-v3-logs-7d --config wrangler.deploy.jsonc || true
          npx wrangler r2 bucket lifecycle add aio-v3-logs aio-v3-logs-7d logs/ --expire-days 7 --force --config wrangler.deploy.jsonc
          npx wrangler r2 bucket lifecycle list aio-v3-logs --config wrangler.deploy.jsonc
      - name: Deploy Worker and dashboard
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        run: npx wrangler deploy --config wrangler.deploy.jsonc
      - name: Verify Cloudflare deployment record
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        run: npx wrangler deployments list --config wrangler.deploy.jsonc
      - name: Publish V3 release artifacts to R2
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        run: |
          set -euo pipefail
          # Worker support for the runtime URL is already live at this point.
          # Publish the large runtime first, then the tiny bootstrap, and the version pointer last.
          # Readers can therefore never observe a new version before both matching artifacts exist.
          npx wrangler r2 object put aio-v3-logs/releases/v3/dist/aio-v3-runtime.js \
            --file=../v3/dist/aio-v3-runtime.js \
            --content-type='application/javascript; charset=utf-8' \
            --cache-control='no-store' \
            --remote \
            --config wrangler.deploy.jsonc
          npx wrangler r2 object put aio-v3-logs/releases/v3/dist/aio-v3.js \
            --file=../v3/dist/aio-v3.js \
            --content-type='application/javascript; charset=utf-8' \
            --cache-control='no-store' \
            --remote \
            --config wrangler.deploy.jsonc
          npx wrangler r2 object put aio-v3-logs/releases/v3/src/release-version.js \
            --file=../v3/src/release-version.js \
            --content-type='application/javascript; charset=utf-8' \
            --cache-control='no-store' \
            --remote \
            --config wrangler.deploy.jsonc
      - name: Verify V3 release artifacts in R2
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/aio-v3-release-version.js /tmp/aio-v3.js /tmp/aio-v3-runtime.js
          npx wrangler r2 object get aio-v3-logs/releases/v3/src/release-version.js --file=/tmp/aio-v3-release-version.js --remote --config wrangler.deploy.jsonc
          npx wrangler r2 object get aio-v3-logs/releases/v3/dist/aio-v3.js --file=/tmp/aio-v3.js --remote --config wrangler.deploy.jsonc
          npx wrangler r2 object get aio-v3-logs/releases/v3/dist/aio-v3-runtime.js --file=/tmp/aio-v3-runtime.js --remote --config wrangler.deploy.jsonc
          cmp ../v3/src/release-version.js /tmp/aio-v3-release-version.js
          cmp ../v3/dist/aio-v3.js /tmp/aio-v3.js
          cmp ../v3/dist/aio-v3-runtime.js /tmp/aio-v3-runtime.js
      - name: Publish immutable V4 runtime release to R2
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') echo "Invalid lowercase Git release SHA: $RELEASE_SHA" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_SHA}" -eq 40 ] || { echo "Release SHA must contain exactly 40 hex characters." >&2; exit 1; }
          npx wrangler r2 object put "aio-v3-logs/releases/v4/$RELEASE_SHA/aio-v4-runtime.js" \
            --file=../v4/dist/aio-v4-runtime.js \
            --content-type='application/javascript; charset=utf-8' \
            --cache-control='no-store' \
            --remote \
            --config wrangler.deploy.jsonc
          npx wrangler r2 object put "aio-v3-logs/releases/v4/$RELEASE_SHA/aio-v4-runtime.sha256" \
            --file=../v4/dist/aio-v4-runtime.sha256 \
            --content-type='text/plain; charset=utf-8' \
            --cache-control='no-store' \
            --remote \
            --config wrangler.deploy.jsonc
      - name: Verify immutable V4 runtime release in R2
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          rm -f /tmp/aio-v4-runtime.js /tmp/aio-v4-runtime.sha256
          npx wrangler r2 object get "aio-v3-logs/releases/v4/$RELEASE_SHA/aio-v4-runtime.js" \
            --file=/tmp/aio-v4-runtime.js --remote --config wrangler.deploy.jsonc
          npx wrangler r2 object get "aio-v3-logs/releases/v4/$RELEASE_SHA/aio-v4-runtime.sha256" \
            --file=/tmp/aio-v4-runtime.sha256 --remote --config wrangler.deploy.jsonc
          cmp ../v4/dist/aio-v4-runtime.js /tmp/aio-v4-runtime.js
          cmp ../v4/dist/aio-v4-runtime.sha256 /tmp/aio-v4-runtime.sha256
          expected_sha="$(tr -d '[:space:]' < /tmp/aio-v4-runtime.sha256)"
          actual_sha="$(sha256sum /tmp/aio-v4-runtime.js | awk '{print $1}')"
          [ "$actual_sha" = "$expected_sha" ] || { echo "R2 V4 runtime SHA-256 mismatch." >&2; exit 1; }
      - name: Verify immutable V4 runtime release over public HTTPS
        if: steps.credentials.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: cloudflare-dashboard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          V4_RELEASE_BASE_URL: https://aio-bot-dashboard.hansijuergenlul.workers.dev
        run: |
          set -euo pipefail
          runtime_url="$V4_RELEASE_BASE_URL/v4/releases/$RELEASE_SHA/aio-v4-runtime.js"
          sha_url="$V4_RELEASE_BASE_URL/v4/releases/$RELEASE_SHA/aio-v4-runtime.sha256"
          rm -f /tmp/aio-v4-public.js /tmp/aio-v4-public.sha256 /tmp/aio-v4-runtime.headers /tmp/aio-v4-sha.headers
          curl --fail --silent --show-error --location \
            --header 'Origin: https://adventure.land' \
            --dump-header /tmp/aio-v4-runtime.headers \
            --output /tmp/aio-v4-public.js \
            "$runtime_url"
          curl --fail --silent --show-error --location \
            --header 'Origin: https://adventure.land' \
            --dump-header /tmp/aio-v4-sha.headers \
            --output /tmp/aio-v4-public.sha256 \
            "$sha_url"
          cmp ../v4/dist/aio-v4-runtime.js /tmp/aio-v4-public.js
          cmp ../v4/dist/aio-v4-runtime.sha256 /tmp/aio-v4-public.sha256
          grep -Eiq '^access-control-allow-origin:[[:space:]]*\*[[:space:]]*$' /tmp/aio-v4-runtime.headers
          grep -Eiq '^cache-control:.*no-store' /tmp/aio-v4-runtime.headers
          grep -Eiq "^x-aio-v4-release-sha:[[:space:]]*$RELEASE_SHA[[:space:]]*$" /tmp/aio-v4-runtime.headers
          grep -Eiq '^content-type:[[:space:]]*application/javascript' /tmp/aio-v4-runtime.headers
          grep -Eiq '^access-control-allow-origin:[[:space:]]*\*[[:space:]]*$' /tmp/aio-v4-sha.headers
          grep -Eiq '^cache-control:.*no-store' /tmp/aio-v4-sha.headers
          grep -Eiq "^x-aio-v4-release-sha:[[:space:]]*$RELEASE_SHA[[:space:]]*$" /tmp/aio-v4-sha.headers
          grep -Eiq '^content-type:[[:space:]]*text/plain' /tmp/aio-v4-sha.headers
          expected_sha="$(tr -d '[:space:]' < /tmp/aio-v4-public.sha256)"
          actual_sha="$(sha256sum /tmp/aio-v4-public.js | awk '{print $1}')"
          [ "$actual_sha" = "$expected_sha" ] || { echo "Public HTTPS V4 runtime SHA-256 mismatch." >&2; exit 1; }
      - name: Remove temporary deploy config
        if: always()
        working-directory: cloudflare-dashboard
        run: rm -f wrangler.deploy.jsonc d1-list.json
