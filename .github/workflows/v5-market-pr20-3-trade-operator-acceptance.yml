name: v5-market-pr20-3-trade-operator-acceptance
on:
  pull_request:
    paths:
      - 'v5/roadmap/pr20-3-trade-operator-acceptance.json'
      - 'v5/grundlage/vertraege/runtime/market-production-preparation.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/grundlage/tests/pr20-market-trade-operator-acceptance.test.mjs'
      - 'v5/dokumentation/PR20-3-MARKT-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/dokumentation/V5-POST-R19-ROADMAP.md'
      - 'v5/package.json'
      - '.github/workflows/v5-market-pr20-3-trade-operator-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - name: Installieren
        working-directory: v5
        run: npm ci
      - name: Trade Operator Acceptance pruefen
        working-directory: v5
        run: npm run market-trade-operator-acceptance:pruefen
