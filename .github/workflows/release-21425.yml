name: release-21425
on:
  push:
    branches: ["release/2.14.25-ui-merchant-map-liveness"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2.14.25
        run: node scripts/apply-21425-ui-merchant-map-liveness.mjs
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('dashboard JS syntax OK');
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Verify v2.14.25 invariants
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('bot.js','utf8'),h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8'),v=JSON.parse(fs.readFileSync('version.json','utf8'));
          function ok(x,m){if(!x)throw new Error(m)}
          ok(v.version==='2.14.25'&&v.dashboardVersion==='2.14.25','version sync');
          ok(b.includes('v21425CatalogClick')&&b.includes('v21425CatalogContext'),'live UI delegates missing');
          ok(b.includes('merchant_bank_liveness_exit')&&b.includes('quarantinePreserved'),'bank liveness exit missing');
          ok(b.includes("brainMinConfidencePct: 70")&&b.includes("brainModel: '@cf/qwen/qwen3-30b-a3b-fp8'"),'Brain invariant changed');
          ok(h.includes('renderMiniTerrains')&&h.includes('data-mini-map'),'mini terrain renderer missing');
          ok(!h.includes('echt G.geometry-Kollisionslinien als Vektor-Fallback'),'old collision hint remains');
          ok(h.includes('<circle r="12"></circle>')&&!h.includes('${mapSprite(c,48)}<text class="sprite-map-label"'),'group map sprite sheet marker remains');
          console.log('v2.14.25 invariants OK');
          NODE
      - name: Normalize historical exact-version assertions
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const f of fs.readdirSync('scripts').filter(x=>/^smoke.*\.js$/.test(x))){
            const p=path.join('scripts',f);let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\.includes\("'"\+([A-Za-z_$][\w$]*)\+"'"\)/g,'.includes($1)');
            s=s.replace(/(assert\.(?:equal|strictEqual)\([^,\n]+,\s*)'2\.14\.(?:21|22|23|24)'/g,"$1'2.14.25'");
            s=s.replace(/version\.version\s*,\s*'2\.14\.(?:21|22|23|24)'/g,"version.version,'2.14.25'");
            s=s.replace(/version\.dashboardVersion\s*,\s*'2\.14\.(?:21|22|23|24)'/g,"version.dashboardVersion,'2.14.25'");
            s=s.replace(/var VERSION = '2\.14\.(?:21|22|23|24)'/g,"var VERSION = '2.14.25'");
            s=s.replace(/AiO Bot Dashboard 2\.14\.(?:21|22|23|24)/g,'AiO Bot Dashboard 2.14.25');
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Run complete smoke suite
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do node "$f"; done
          shopt -s nullglob
          for f in scripts/smoke*.mjs; do node "$f"; done
      - name: Restore historical smoke sources before diff
        run: git checkout -- scripts/smoke*.js || true
      - name: Diff check
        run: git diff --check
      - name: Commit verified release tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js version.json cloudflare-dashboard/package.json cloudflare-dashboard/dashboard.html cloudflare-dashboard/src/worker.js
          git commit -m 'Release AiO Bot 2.14.25 UI Merchant map liveness'
          git push origin HEAD:${GITHUB_REF_NAME}
