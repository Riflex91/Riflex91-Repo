name: debug-v3-unit-tests
on:
  push:
    branches:
      - fix/p0-regroup-bundle-supply-5000

permissions:
  contents: read

jobs:
  unit-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v3 guard dependencies
        working-directory: v3
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build bootstrap and remote runtime bundles
        working-directory: v3
        run: npm run build
      - name: Release + Logic Guardian preflight
        working-directory: v3
        run: npm run preflight
      - name: Run v3 unit tests with captured output
        working-directory: v3
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-output.txt
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-unit-test-output
          path: v3/unit-output.txt
          if-no-files-found: warn
