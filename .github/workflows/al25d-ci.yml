name: AL 2.5D CI

on:
  pull_request:
    paths:
      - "AL 2.5d/**"
      - ".github/workflows/al25d-ci.yml"
  push:
    branches:
      - main
    paths:
      - "AL 2.5d/**"
      - ".github/workflows/al25d-ci.yml"

permissions:
  contents: read

concurrency:
  group: al25d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "AL 2.5d"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "AL 2.5d/package.json"

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Verify, test and build
        run: npm run check
