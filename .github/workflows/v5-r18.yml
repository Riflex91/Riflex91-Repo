name: v5-r18

# Nur noch manuelle Offline-Diagnose. Funktionale V5-Freigaben erfolgen
# durch source-locked JavaScript-Tests im echten Adventure-Land-Browser via CDP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-offline-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci
      - name: R18 nur manuell diagnostizieren
        working-directory: v5
        run: npm run r18:pruefen
