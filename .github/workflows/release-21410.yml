name: Release 2.14.10 Discovery Safety

on:
  push:
    branches:
      - hotfix/2.14.10-discovery-safety

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[release-21410]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 2.14.10 patch
        run: python3 scripts/patch-21410.py
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Retained smoke tests
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Diff sanity
        run: git diff --check
      - name: Commit tested release
        run: |
          rm -f scripts/patch-21410.py .github/workflows/release-21410.yml
          git config user.name "aio-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release 2.14.10: Harden Merchant discovery travel [release-21410]"
          git push origin HEAD:hotfix/2.14.10-discovery-safety
