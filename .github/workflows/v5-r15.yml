name: v5-r15

on:
  pull_request:
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r15-*.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/P0-05-UPGRADE-COMPOUND.md'
      - 'v5/dokumentation/P0-06-EXCHANGE-CRAFT-OUTPUTSPACE.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r15.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r15-*.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/P0-05-UPGRADE-COMPOUND.md'
      - 'v5/dokumentation/P0-06-EXCHANGE-CRAFT-OUTPUTSPACE.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r15.yml'

permissions:
  contents: read

jobs:
  merchant-core-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Exakten Head verifizieren
        shell: bash
        run: |
          set -euo pipefail
          ERWARTET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          IST="$(git rev-parse HEAD)"
          test "$IST" = "$ERWARTET"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci

      - name: R15 Merchant Core B pruefen
        working-directory: v5
        run: npm run r15:pruefen
