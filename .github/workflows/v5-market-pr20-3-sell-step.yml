name: v5-market-pr20-3-sell-step
on:
  pull_request:
    paths:
      - 'v5/grundlage/quelle/merchant/market-sell-settlement.ts'
      - 'v5/grundlage/vertraege/runtime/market-sell-production-candidate.json'
      - 'v5/grundlage/vertraege/runtime/market-production-preparation.json'
      - 'v5/grundlage/tests/pr20-market-sell-settlement.test.mjs'
      - 'v5/werkzeuge/pr20-3-market-sell-step-test-**'
      - 'v5/werkzeuge/tests/pr20-3-market-sell-step-test.test.mjs'
      - 'v5/roadmap/pr20-3-market-sell-step-test-plan.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/dokumentation/PR20-3-MARKT-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/package.json'
      - '.github/workflows/v5-market-pr20-3-sell-step.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - name: Installieren
        working-directory: v5
        run: npm ci
      - name: PR20.3 NPC-Sell Step Safety
        working-directory: v5
        run: npm run market-sell-production:step-pruefen
