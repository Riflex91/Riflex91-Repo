name: release-21427
on:
  push:
    branches: ["release/2.14.27-live-proof-fixes"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare v2.14.27 release tree
        run: node scripts/apply-21427-live-proof-fixes.mjs
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('dashboard JS syntax OK');
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Verify v2.14.27 live fixes
        run: node scripts/verify-21427-live-proof-fixes.mjs
      - name: Normalize historical exact-version smoke assertions
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const f of fs.readdirSync('scripts').filter(x=>/^smoke.*\.(?:js|mjs)$/.test(x))){
            const p=path.join('scripts',f);let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\.includes\("'"\+([A-Za-z_$][\w$]*)\+"'"\)/g,'.includes($1)');
            s=s.replace(/2\.14\.\d+/g,'2.14.27');
            s=s.replace("assert(dash.includes('G.geometry-Kollisionslinien als Vektor-Fallback'));","assert(dash.includes('Adventure Land G.geometry/G.tilesets')); // real terrain only");
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Run complete smoke suite
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/smoke*.js; do node "$f"; done
          for f in scripts/smoke*.mjs; do node "$f"; done
      - name: Restore temporary smoke edits before diff
        run: git checkout -- scripts/smoke*.js scripts/smoke*.mjs || true
      - name: Diff check
        run: git diff --check
      - name: Commit verified release tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js version.json cloudflare-dashboard/package.json cloudflare-dashboard/dashboard.html cloudflare-dashboard/src/worker.js
          git commit -m 'Release AiO Bot 2.14.27 live-proof fixes'
          git push origin HEAD:${GITHUB_REF_NAME}
