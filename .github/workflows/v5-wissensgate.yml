name: v5-wissensgate

# Manuelle Offline-Diagnose; reale Capability-Freigabe nur durch Ingame-JavaScript.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-offline-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wissensbasis diagnostizieren
        run: node v5/werkzeuge/wissensbasis-pruefen.mjs
      - name: Entwicklungs-Wissensgate diagnostizieren
        run: node v5/werkzeuge/entwicklungs-wissensgate.mjs
