name: Mewthisch Guides addon v0.11.2

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate navigation bearing math
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides/Navigation.lua"))("MewthischGuides",MG)

          local function near(actual,expected,label)
            assert(actual~=nil,label..": nil")
            assert(math.abs(actual-expected)<=0.0001,
              string.format("%s expected %.6f got %.6f",label,expected,actual))
          end

          local rel,abs=MG:ComputeRelativeBearing(0,1,0)
          near(abs,0,"north")
          near(rel,0,"north relative")
          rel,abs=MG:ComputeRelativeBearing(1,0,0)
          near(abs,math.pi*3/2,"east")
          near(rel,-math.pi/2,"east relative")

          near(MG:ComputeWorldAbsoluteBearing(1,0),0,"world north")
          near(MG:ComputeWorldAbsoluteBearing(0,-1),math.pi*3/2,"world east")
          near(MG:ComputeWorldAbsoluteBearing(-1,0),math.pi,"world south")
          near(MG:ComputeWorldAbsoluteBearing(0,1),math.pi/2,"world west")

          local playerX,playerY=.4207731485366821,.6839030981063843
          local targetX,targetY=.443026065826416,.5564066171646118
          local facing=.03902159631252289
          rel,abs=MG:ComputeRelativeBearing(targetX-playerX,playerY-targetY,facing)
          assert(rel<0 and rel>-0.35,"field bearing regression")
          assert(abs>6.0,"field absolute bearing regression")
          print("Bearing math PASS")
          LUA

      - name: Validate RestedXP world axes and Mulgore map geometry
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local function vec(x,y)
            return {
              x=x,y=y,
              GetXY=function(self) return self.x,self.y end,
            }
          end

          local width,height=5137.5,3425
          local left,top=2047.9,-272.92

          CreateVector2D=function(x,y) return vec(x,y) end
          C_Map={
            GetWorldPosFromMapPos=function(mapID,point)
              local x,y=point:GetXY()
              local rxpX=left-width*x
              local rxpY=top-height*y
              -- Blizzard vector order is north/south first, west/east second.
              return 1,vec(rxpY,rxpX)
            end,
            GetMapWorldSize=function(mapID) return width,height end,
          }

          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides/ForeverAPI.lua"))(
            "MewthischGuides",MG)

          local map=assert(MG.ForeverAPI:RestedXPWorldToMap(
            1412,-259.85,-2914.28))
          assert(math.abs(map.x-.4492)<.0002,
            string.format("Mulgore x mismatch %.6f",map.x))
          assert(math.abs(map.y-.7712)<.0002,
            string.format("Mulgore y mismatch %.6f",map.y))

          local world=assert(MG.ForeverAPI:MapToRestedXPWorld(
            1412,.443,.798))
          assert(math.abs(world.x-(left-width*.443))<.01)
          assert(math.abs(world.y-(top-height*.798))<.01)
          print("RestedXP world-axis/map-geometry PASS")
          LUA

      - name: Validate quest progress tracking
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={runtime={}}}
          C_QuestLog=nil
          GetNumQuestLogEntries=function() return 1,1 end
          GetQuestLogTitle=function(index)
            return "Legacy Quest",7,0,false,false,false,0,12345
          end
          GetNumQuestLeaderBoards=function(index) return 1 end
          GetQuestLogLeaderBoard=function(objective,index)
            return "Testgegner: 3/5","monster",false
          end
          IsQuestFlaggedCompleted=function() return false end

          assert(loadfile("world of warcraft/MewthischGuides/QuestTracking.lua"))(
            "MewthischGuides",MG)

          local snapshot=MG.QuestTracking:Refresh("unit")
          assert(snapshot[12345],"legacy quest missing")
          assert(snapshot[12345].trackingSource=="LegacyQuestLog")
          assert(snapshot[12345].objectives[1].numFulfilled==3)
          assert(snapshot[12345].objectives[1].numRequired==5)
          print("Quest progress tracking PASS")
          LUA

      - name: Validate preset resync and objective progression
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            Data={guide={id="test",steps={
              {id="q1",order=10,questID=1,title="Q1",faction="Horde"},
              {id="q2",order=20,questID=2,title="Q2",faction="Horde"},
              {id="q3",order=30,questID=3,title="Q3",faction="Horde"},
            }}},
            db={settings={routeMode="preset"},runtime={}},
          }
          assert(loadfile("world of warcraft/MewthischGuides/GoalEngine.lua"))("MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/StepEngine.lua"))("MewthischGuides",MG)

          MG.GetPlayerProfile=function()
            return {faction="Horde",race="Troll",class="HUNTER",level=8}
          end
          MG.Log=function() end
          MG.IsQuestFlaggedCompletedSafe=function(_,questID) return questID==1 end
          MG.GetQuestLogSnapshot=function()
            return {
              [2]={questID=2,title="Q2",level=2,questLogIndex=1,readyForTurnIn=false,
                objectives={{type="monster",text="Boar: 2/10",numFulfilled=2,numRequired=10,finished=false}}},
              [3]={questID=3,title="Q3",level=3,questLogIndex=2,readyForTurnIn=false,
                objectives={{type="item",text="Thing: 1/2",numFulfilled=1,numRequired=2,finished=false}}},
            }
          end

          local steps,preferredIndex,reason=MG:BuildGuideSteps()
          assert(#steps==2)
          assert(steps[preferredIndex].questID==3,
            "preset resync must choose furthest active route quest")
          assert(reason=="furthest_active_route_quest")
          print("Preset resync PASS")
          LUA

      - name: Validate manual nearest-target routing
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            db={settings={routeMode="manual"},runtime={}},
            StepPhases={OBJECTIVES="objectives",TURNIN="turnin"},
            Log=function() end,
          }
          MG.GetQuestLogSnapshot=function()
            return {
              [1]={questID=1,title="Far",questLogIndex=1,readyForTurnIn=false,objectives={}},
              [2]={questID=2,title="Near",questLogIndex=2,readyForTurnIn=false,objectives={}},
            }
          end
          MG.BuildLiveFallbackStep=function(_,entry)
            return {questID=entry.questID,questLogIndex=entry.questLogIndex,
              phase="objectives",title=entry.title}
          end
          MG.ForeverAPI={GetPlayerPosition=function() return {mapID=1,x=.5,y=.5} end}
          MG.RouteEngine={
            Resolve=function(_,step)
              local x=step.questID==1 and .9 or .55
              return {mapID=1,x=x,y=.5,source="QuestMapPOI"}
            end,
            EstimateDistanceToTarget=function(_,target)
              return math.abs(target.x-.5),"normalized_map"
            end,
          }

          assert(loadfile("world of warcraft/MewthischGuides/ManualRoute.lua"))(
            "MewthischGuides",MG)
          local steps,index,reason=MG:BuildManualRouteSteps()
          assert(#steps==2 and index==1)
          assert(steps[1].questID==2,"manual mode did not choose nearest active quest")
          assert(reason=="manual_nearest_active_quest")
          print("Manual routing PASS")
          LUA

      - name: Validate RouteEngine and RestedXP objective target
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            db={runtime={}},
            Log=function() end,
            GetPlayerProfile=function() return {faction="Horde",race="Orc",class="HUNTER"} end,
          }
          assert(loadfile("world of warcraft/MewthischGuides/RouteEngine.lua"))("MewthischGuides",MG)
          MG.ForeverAPI={
            GetPlayerPosition=function() return {mapID=1411,x=.1,y=.1} end,
            GetQuestLineCoordinate=function() return nil end,
            FindQuestOnMaps=function()
              return {mapID=1411,x=.4,y=.6,source="QuestMapPOI",phaseMatch=true}
            end,
            GetNextQuestWaypoint=function() return nil end,
            GetLegacyQuestPOI=function() return nil end,
            GetNavigationCoordinate=function() return nil end,
            MapToWorld=function() return nil end,
          }
          MG.RestEDXPImport={
            GetCoordinate=function(_,definition,phase,profile,objective)
              assert(objective==2,"objective index not forwarded to RestedXP")
              return {mapID=1411,x=.2,y=.3,source="RestedXPPublicRouteData",phaseMatch=true}
            end,
          }

          local target=MG.RouteEngine:Resolve({
            questID=789,phase="objectives",verification="RESTEDXP_PUBLIC",
            definition={rxpOccurrences={{}}},goal={index=2},
          })
          assert(target and target.source=="RestedXPPublicRouteData")
          assert(target.score==99)
          print("RouteEngine objective target PASS")
          LUA

      - name: Validate RestedXP progress occurrence
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={rxpSeason=0,rxpRate=1,rxpHardcoreMode=false,rxpSoDMode=false}}}
          for i=1,5 do
            assert(loadfile(string.format(
              "world of warcraft/MewthischGuides/RestedXPForeverData_%02d.lua",i)))(
                "MewthischGuides",MG)
          end
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPActionCatalog.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPImport.lua"))(
            "MewthischGuides",MG)

          local stats=MG.RestEDXPImport:GetStats()
          assert(stats.sourceFiles==27)
          assert(stats.rawGuides==101)
          assert(stats.rawSteps==14602)
          assert(stats.structuredActions==68646)
          assert(stats.unknownActionKinds==0)
          assert(stats.unknownActions==0)

          local synthetic={
            order=100,
            rxpOccurrences={
              {phase="accept",sourceStep=1,sourceAction=1,tags={}},
              {phase="objectives",objective=1,sourceStep=5,sourceAction=2,tags={}},
              {phase="objectives",objective=2,sourceStep=8,sourceAction=3,tags={}},
              {phase="turnin",sourceStep=10,sourceAction=1,tags={}},
            },
          }
          local profile={faction="Horde",race="Orc",class="HUNTER",level=3}
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"objectives",profile,1)==502)
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"objectives",profile,2)==803)
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"complete",profile,nil)==1001)

          MG.ForeverAPI={
            GetPlayerPosition=function() return {mapID=1412,x=.443,y=.798} end,
            MapToRestedXPWorld=function()
              return {continentID=1,x=-228.3,y=-3006.1}
            end,
          }
          local loopDefinition={
            rxpOccurrences={{
              phase="objectives",objective=1,sourceStep=20,sourceAction=9,tags={},
              coordinate={mapID=1412,worldX=-385.2,worldY=-3117.38,
                source="RestedXPPublicRouteData"},
              routeCoordinates={
                {mapID=1412,worldX=-385.2,worldY=-3117.38,
                  source="RestedXPPublicRouteData"},
                {mapID=1412,worldX=-259.85,worldY=-2914.28,
                  source="RestedXPPublicRouteData"},
                {mapID=1412,worldX=-228.2,worldY=-3006.0,
                  source="RestedXPPublicRouteData"},
              },
            }},
          }
          local nearest=assert(MG.RestEDXPImport:GetCoordinate(
            loopDefinition,"objectives",profile,1))
          assert(nearest.rxpRoutePointIndex==3,
            "objective loop did not choose nearest waypoint")
          assert(nearest.rxpRoutePointCount==3)
          print("RestedXP progress occurrence PASS")
          LUA

      - name: Validate world map marker
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local calls={set=0,clear=0}
          local MG={
            db={settings={showWorldMapMarker=true}},
            ForeverAPI={
              SetWorldMapWaypoint=function(_,target)
                calls.set=calls.set+1
                return true,{mapID=target.mapID,x=target.x,y=target.y}
              end,
              ClearWorldMapWaypoint=function()
                calls.clear=calls.clear+1
                return true
              end,
            },
            Log=function() end,
          }

          assert(loadfile("world of warcraft/MewthischGuides/WorldMapMarker.lua"))(
            "MewthischGuides",MG)
          MG:RefreshWorldMapMarker({mapID=1411,x=.4,y=.6,source="test"})
          assert(calls.set==1)
          MG.db.settings.showWorldMapMarker=false
          MG:RefreshWorldMapMarker(nil)
          assert(calls.clear==1)
          print("World map marker PASS")
          LUA

      - name: Validate better-gear auto-equip
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local pickupCalls,equipSlot,equipByNameSlot=0,nil,nil
          local MG={
            Data={gearProfiles={}},
            db={settings={
              gearAutoEquip=true,
              gearRequireHighConfidence=true,
              gearAutoEquipItemLevelFallback=true,
              gearAutoEquipWeapons=false,
              gearProtectBoE=true,
            },runtime={}},
            BuildState={GetState=function() return {class="HUNTER"} end},
            Inventory={GetSnapshot=function() return {bags={},equipped={}} end},
            Log=function() end,
          }

          GetItemInfoInstant=function() return 1001,"Armor","Leather","INVTYPE_CHEST" end
          GetDetailedItemLevelInfo=function(link)
            if link=="candidate" then return 20 end
            if link=="equipped" then return 10 end
          end
          IsEquippableItem=function() return true end
          IsUsableItem=function() return false end
          GetInventoryItemLink=function() return "equipped" end
          C_Container={PickupContainerItem=function() pickupCalls=pickupCalls+1 end}
          EquipCursorItem=function(slot) equipSlot=slot end
          EquipItemByName=function(link,slot) equipByNameSlot=slot end

          assert(loadfile("world of warcraft/MewthischGuides/GearAdvisor.lua"))(
            "MewthischGuides",MG)
          local candidate=assert(MG.GearAdvisor:EvaluateItemLink("candidate"))
          candidate.bag,candidate.bagSlot,candidate.isBound=0,1,true

          local equipped,reason=MG.GearAdvisor:TryAutoEquip(candidate)
          assert(equipped and reason=="equipped")
          assert(equipByNameSlot==5,"EquipItemByName path not used")
          assert(pickupCalls==0 and equipSlot==nil,
            "cursor fallback should not run when EquipItemByName exists")

          candidate.isBound=false
          equipped,reason=MG.GearAdvisor:TryAutoEquip(candidate)
          assert(not equipped and reason=="boe_protected")
          print("Better-gear auto-equip PASS")
          LUA

      - name: Validate seven themes and adaptive UI skins
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local skin={
            IsEnabled=function() return true end,
            GetAccentColor=function() return .05,.82,.62 end,
            GetPanelColor=function() return .04,.05,.06,.97 end,
            GetFont=function() return "Fonts\\FRIZQT__.TTF","" end,
            OnLooksChanged=function() end,
          }
          _G.EllesmereUI={
            RegisterSkin=function(name,callback)
              assert(name=="MewthischGuides")
              callback(skin)
            end,
          }

          local elv={
            media={
              backdropfadecolor={r=.06,g=.06,b=.06,a=.8},
              bordercolor={r=0,g=0,b=0,a=1},
              rgbvaluecolor={r=.09,g=.52,b=.82,a=1},
              normFont="Fonts\\FRIZQT__.TTF",
            },
            db={general={}},
          }
          _G.ElvUI={elv}
          _G.ElvUI_ToxiUI={
            {Title="ToxiUI"},
            {},
            elv,
            {Strings={Branding={ColorRGB={r=.094,g=.659,b=1,a=1}}}},
          }

          local MG={db={settings={theme="ElvUI"}},Log=function() end}
          assert(loadfile("world of warcraft/MewthischGuides/Themes.lua"))(
            "MewthischGuides",MG)

          local expected={
            "ElvUI","EllesmereUI","ToxiUI","Forever Classic",
            "Obsidian","Arcane","Warcraft Heritage",
          }
          assert(#MG.Themes.order==#expected)
          for i,name in ipairs(expected) do
            assert(MG.Themes.order[i]==name,
              string.format("theme order mismatch at %d: %s",i,tostring(MG.Themes.order[i])))
          end

          assert(MG.Themes:Get("ElvUI").adaptiveElvUI==true)
          assert(MG.Themes:Get("EllesmereUI").adaptiveEllesmereUI==true)
          assert(MG.Themes:Get("ToxiUI").adaptiveToxiUI==true)

          local eui,euiName=MG.Themes:Resolve("EllesmereUI")
          assert(euiName=="EllesmereUI" and eui.ellesmereUIDetected)
          assert(math.abs(eui.accent[2]-.82)<.001)

          local tx,txName=MG.Themes:Resolve("ToxiUI")
          assert(txName=="ToxiUI" and tx.toxiUIDetected and tx.elvUIDetected)
          assert(math.abs(tx.accent[1]-.094)<.001)
          assert(math.abs(tx.accent[2]-.659)<.001)
          assert(math.abs(tx.accent[3]-1)<.001)

          local elvTheme,name=MG.Themes:GetCurrent()
          assert(name=="ElvUI" and elvTheme.elvUIDetected)
          print("Seven-theme contract PASS")
          LUA

      - name: Validate v0.11.2 static contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="world of warcraft/MewthischGuides"
          TOC="$ROOT/MewthischGuides.toc"
          UI="$ROOT/UI.lua"

          grep -q '^## Interface: 16001$' "$TOC"
          grep -q '^## Version: 0.11.2
          grep -q '^ManualRoute.lua$' "$TOC"
          grep -q '^WorldMapMarker.lua$' "$TOC"
          grep -q '^RestedXPImport.lua$' "$TOC"

          grep -q 'makeButton(footer, "Config"' "$UI"
          grep -q '"Manuell"' "$UI"
          grep -q '"Vorgegeben"' "$UI"
          grep -q 'showWorldMapMarker' "$UI"
          grep -q 'gearAutoEquipItemLevelFallback = true' "$ROOT/Logger.lua"
          grep -q 'routeMode = "preset"' "$ROOT/Logger.lua"
          grep -q 'SetWorldMapWaypoint' "$ROOT/ForeverAPI.lua"
          grep -q 'furthest_active_route_quest' "$ROOT/StepEngine.lua"
          grep -q 'MapToRestedXPWorld' "$ROOT/ForeverAPI.lua"
          grep -q 'RestedXPWorldToMap' "$ROOT/ForeverAPI.lua"
          grep -q 'rxpRoutePointCount' "$ROOT/RestedXPImport.lua"
          grep -q 'objectiveProgressColor' "$UI"
          grep -q 'goalRowText' "$UI"
          grep -q 'arrow:SetSize(104, 104)' "$ROOT/Navigator.lua"
          grep -q 'theme = "ElvUI"' "$ROOT/Logger.lua"
          grep -q '^## OptionalDeps: ElvUI, EllesmereUI, ElvUI_ToxiUI
          if grep -q 'makeButton(footer, "Pfeil"' "$UI"; then
            echo "Deprecated footer arrow button is still present."
            exit 1
          fi

          if grep -q 'not equippable(link, equipLoc) or not usable(link)' "$ROOT/GearAdvisor.lua"; then
            echo "Armor auto-equip is still blocked by IsUsableItem."
            exit 1
          fi

          if grep -En 'Toete|verfuegbar|zurueckgesetzt|geaendert|geoeffnet|ausgewaehlt|benoetigten|fuer Befehle|laeuft' "$ROOT"/*.lua; then
            echo "German user-facing transliteration detected; use real umlauts."
            exit 1
          fi

          grep -q 'gearAutoEquip = false' "$ROOT/Logger.lua"
          grep -q 'gearProtectBoE = true' "$ROOT/Logger.lua"
          grep -q 'gearAutoEquipWeapons = false' "$ROOT/Logger.lua"
          grep -q 'autoSelection = false' "$ROOT/RewardAdvisor.lua"
          grep -q 'automaticSpending = false' "$ROOT/TalentAdvisor.lua"
          grep -q 'localOnly = true' "$ROOT/Telemetry.lua"

      - name: Package addon
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/MewthischGuides
          cp -R "world of warcraft/MewthischGuides/"* artifacts/MewthischGuides/
          cd artifacts
          zip -r MewthischGuides-v0.11.2.zip MewthischGuides

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides-v0.11.2
          path: artifacts/MewthischGuides-v0.11.2.zip
          if-no-files-found: error
 "$TOC"
          grep -q '^ManualRoute.lua$' "$TOC"
          grep -q '^WorldMapMarker.lua$' "$TOC"
          grep -q '^RestedXPImport.lua$' "$TOC"

          grep -q 'makeButton(footer, "Config"' "$UI"
          grep -q '"Manuell"' "$UI"
          grep -q '"Vorgegeben"' "$UI"
          grep -q 'showWorldMapMarker' "$UI"
          grep -q 'gearAutoEquipItemLevelFallback = true' "$ROOT/Logger.lua"
          grep -q 'routeMode = "preset"' "$ROOT/Logger.lua"
          grep -q 'SetWorldMapWaypoint' "$ROOT/ForeverAPI.lua"
          grep -q 'furthest_active_route_quest' "$ROOT/StepEngine.lua"
          grep -q 'MapToRestedXPWorld' "$ROOT/ForeverAPI.lua"
          grep -q 'RestedXPWorldToMap' "$ROOT/ForeverAPI.lua"
          grep -q 'rxpRoutePointCount' "$ROOT/RestedXPImport.lua"
          grep -q 'objectiveProgressColor' "$UI"
          grep -q 'goalRowText' "$UI"
          grep -q 'arrow:SetSize(104, 104)' "$ROOT/Navigator.lua"

          if grep -q 'makeButton(footer, "Pfeil"' "$UI"; then
            echo "Deprecated footer arrow button is still present."
            exit 1
          fi

          if grep -q 'not equippable(link, equipLoc) or not usable(link)' "$ROOT/GearAdvisor.lua"; then
            echo "Armor auto-equip is still blocked by IsUsableItem."
            exit 1
          fi

          if grep -En 'Toete|verfuegbar|zurueckgesetzt|geaendert|geoeffnet|ausgewaehlt|benoetigten|fuer Befehle|laeuft' "$ROOT"/*.lua; then
            echo "German user-facing transliteration detected; use real umlauts."
            exit 1
          fi

          grep -q 'gearAutoEquip = false' "$ROOT/Logger.lua"
          grep -q 'gearProtectBoE = true' "$ROOT/Logger.lua"
          grep -q 'gearAutoEquipWeapons = false' "$ROOT/Logger.lua"
          grep -q 'autoSelection = false' "$ROOT/RewardAdvisor.lua"
          grep -q 'automaticSpending = false' "$ROOT/TalentAdvisor.lua"
          grep -q 'localOnly = true' "$ROOT/Telemetry.lua"

      - name: Package addon
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/MewthischGuides
          cp -R "world of warcraft/MewthischGuides/"* artifacts/MewthischGuides/
          cd artifacts
          zip -r MewthischGuides-v0.11.2.zip MewthischGuides

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides-v0.11.2
          path: artifacts/MewthischGuides-v0.11.2.zip
          if-no-files-found: error
 "$TOC"
          grep -q '"EllesmereUI"' "$ROOT/Themes.lua"
          grep -q '"ToxiUI"' "$ROOT/Themes.lua"
          grep -q 'adaptiveEllesmereUI = true' "$ROOT/Themes.lua"
          grep -q 'adaptiveToxiUI = true' "$ROOT/Themes.lua"

          if grep -q 'makeButton(footer, "Pfeil"' "$UI"; then
