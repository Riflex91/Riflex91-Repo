        run: |
          set -euo pipefail
          ROOT="world of warcraft/MewthischGuides"
          TOC="$ROOT/MewthischGuides.toc"
          API="$ROOT/ForeverAPI.lua"
          ROUTE="$ROOT/RouteEngine.lua"
          NAV="$ROOT/Navigation.lua"
          UI="$ROOT/UI.lua"
          NAVIGATOR="$ROOT/Navigator.lua"

          grep -q '^## Interface: 16001$' "$TOC"
          grep -q '^## Title: Mewthisch Guides$' "$TOC"
          grep -q '^## Version: 0.10.0$' "$TOC"
          grep -q '^ForeverAPI.lua$' "$TOC"
          grep -q '^RouteEngine.lua$' "$TOC"
          grep -q '^RestedXPActionCatalog.lua
            grep -q "^RestedXPForeverData_$chunk.lua$" "$TOC"
          done

          grep -q 'forever-modern-capability' "$API"
          grep -q 'GetQuestsOnMap' "$API"
          grep -q 'RestedXPPublicRouteData = 99' "$ROUTE"
          grep -q 'RestedXPWorldCoordinates' "$NAV"
          grep -q 'Nächstes Theme' "$UI"
          grep -q 'ElvUI' "$UI"
          grep -q 'RestedXP-Guidequellen' "$UI"
          grep -q 'RestedXP-Aktionsabdeckung' "$UI"
          grep -q 'CC BY-NC-SA 4.0' "$ROOT/THIRD_PARTY_NOTICES.md"

          if grep -q 'navigationScreenAngle' "$NAV"; then
            echo "Unsafe guessed screen-angle fallback detected."
            exit 1
          fi

          if grep -q 'RegisterForClicks' "$NAVIGATOR"; then
            echo "Navigator uses Button-only RegisterForClicks on a normal Frame."
            exit 1
          fi

          if grep -En 'Toete|verfuegbar|zurueckgesetzt|geaendert|geoeffnet|ausgewaehlt|benoetigten|fuer Befehle|laeuft' "$ROOT"/*.lua; then
            echo "German user-facing transliteration detected; use real umlauts."
            exit 1
          fi

          grep -q 'gearAutoEquip = false' "$ROOT/Logger.lua"
          grep -q 'gearProtectBoE = true' "$ROOT/Logger.lua"
          grep -q 'gearAutoEquipWeapons = false' "$ROOT/Logger.lua"
          grep -q 'autoSelection = false' "$ROOT/RewardAdvisor.lua"
          grep -q 'automaticSpending = false' "$ROOT/TalentAdvisor.lua"
          grep -q 'localOnly = true' "$ROOT/Telemetry.lua"

