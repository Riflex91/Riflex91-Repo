          grep -q '^## Interface: 16001$' "$TOC"
          grep -q '^## Version: 0.12.0$' "$TOC"
          grep -q '^## OptionalDeps: ElvUI, EllesmereUI, ElvUI_ToxiUI$' "$TOC"

          for file in GuideRegistry.lua SupportedRoutes.lua Localization.lua SettingsSchema.lua ForeverQuestDB.lua TravelPlanner.lua SmartResync.lua RestedXPActionEngine.lua TrainerAdvisor.lua AudioFeedback.lua Journey.lua UI2.lua; do
            grep -q "^$file$" "$TOC"
            test -f "$ROOT/$file"
