name: Mewthisch Guides addon v0.4

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate bearing math
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG = {}
          local chunk = assert(loadfile("world of warcraft/MewthischGuides/Navigation.lua"))
          chunk("MewthischGuides", MG)

          local function near(actual, expected, epsilon, label)
            epsilon = epsilon or 0.0001
            assert(math.abs(actual - expected) <= epsilon,
              string.format("%s: expected %.6f got %.6f", label, expected, actual))
          end

          local rel, abs = MG:ComputeRelativeBearing(0, 1, 0)
          near(abs, 0, 0.0001, "north absolute")
          near(rel, 0, 0.0001, "north relative")

          rel, abs = MG:ComputeRelativeBearing(1, 0, 0)
          near(abs, math.pi / 2, 0.0001, "east absolute")
          near(rel, math.pi / 2, 0.0001, "east from north")

          rel = MG:ComputeRelativeBearing(1, 0, math.pi / 2)
          near(rel, 0, 0.0001, "east while facing east")

          rel, abs = MG:ComputeRelativeBearing(0, -1, 0)
          near(abs, math.pi, 0.0001, "south absolute")
          near(math.abs(rel), math.pi, 0.0001, "south relative")

          rel = MG:ComputeRelativeBearing(-1, 0, 0)
          near(rel, -math.pi / 2, 0.0001, "west from north")

          print("Bearing math PASS")
          LUA

      - name: Validate Step 2 contract
        shell: bash
        run: |
          set -euo pipefail
          TOC="world of warcraft/MewthischGuides/MewthischGuides.toc"
          NAV="world of warcraft/MewthischGuides/Navigation.lua"
          ARROW="world of warcraft/MewthischGuides/Navigator.lua"
          GOALS="world of warcraft/MewthischGuides/GoalEngine.lua"

          grep -q '^## Interface: 16001$' "$TOC"
          grep -q '^## Title: Mewthisch Guides$' "$TOC"
          grep -q '^## Version: 0.4.0$' "$TOC"
          grep -q '^GoalEngine.lua$' "$TOC"
          grep -q '^Navigator.lua$' "$TOC"

          grep -q 'GoalStates' "$GOALS"
          grep -q 'BuildQuestGoals' "$GOALS"
          grep -q 'GetActiveGoal' "$GOALS"
          grep -q 'goalSummary' "world of warcraft/MewthischGuides/UI.lua"

          grep -q 'YARDS_TO_METERS = 0.9144' "$NAV"
          grep -q 'ComputeAbsoluteBearing' "$NAV"
          grep -q 'ComputeRelativeBearing' "$NAV"
          grep -q 'local deltaY = ty - py' "$NAV"
          grep -q 'QuestPOIUpdateIcons' "$NAV"
          grep -q 'directionReliable' "$NAV"
          if grep -q 'navigationScreenAngle' "$NAV"; then
            echo "Unsafe screen-angle fallback is still present."
            exit 1
          fi

          grep -q 'Intentionally no background' "$ARROW"
          grep -q 'UI-HUD-Minimap-Arrow-Player' "$ARROW"
          grep -q 'Never show a guessed direction' "$ARROW"

      - name: Package addon
        shell: bash
        run: |
          mkdir -p artifacts/MewthischGuides
          cp -R "world of warcraft/MewthischGuides/"* artifacts/MewthischGuides/
          cd artifacts
          zip -r MewthischGuides-v0.4.zip MewthischGuides

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides-v0.4
          path: artifacts/MewthischGuides-v0.4.zip
          if-no-files-found: error
