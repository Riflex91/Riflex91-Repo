name: Mewthisch Guides addon v0.12.0

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate navigation bearing math
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides/Navigation.lua"))("MewthischGuides",MG)

          local function near(actual,expected,label)
            assert(actual~=nil,label..": nil")
            assert(math.abs(actual-expected)<=0.0001,
              string.format("%s expected %.6f got %.6f",label,expected,actual))
          end

          local rel,abs=MG:ComputeRelativeBearing(0,1,0)
          near(abs,0,"north")
          near(rel,0,"north relative")
          rel,abs=MG:ComputeRelativeBearing(1,0,0)
          near(abs,math.pi*3/2,"east")
          near(rel,-math.pi/2,"east relative")

          near(MG:ComputeWorldAbsoluteBearing(1,0),0,"world north")
          near(MG:ComputeWorldAbsoluteBearing(0,-1),math.pi*3/2,"world east")
          near(MG:ComputeWorldAbsoluteBearing(-1,0),math.pi,"world south")
          near(MG:ComputeWorldAbsoluteBearing(0,1),math.pi/2,"world west")

          local playerX,playerY=.4207731485366821,.6839030981063843
          local targetX,targetY=.443026065826416,.5564066171646118
          local facing=.03902159631252289
          rel,abs=MG:ComputeRelativeBearing(targetX-playerX,playerY-targetY,facing)
          assert(rel<0 and rel>-0.35,"field bearing regression")
          assert(abs>6.0,"field absolute bearing regression")
          print("Bearing math PASS")
          LUA

      - name: Validate RestedXP world axes and Mulgore map geometry
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local function vec(x,y)
            return {
              x=x,y=y,
              GetXY=function(self) return self.x,self.y end,
            }
          end

          local width,height=5137.5,3425
          local left,top=2047.9,-272.92

          CreateVector2D=function(x,y) return vec(x,y) end
          C_Map={
            GetWorldPosFromMapPos=function(mapID,point)
              local x,y=point:GetXY()
              local rxpX=left-width*x
              local rxpY=top-height*y
              -- Blizzard vector order is north/south first, west/east second.
              return 1,vec(rxpY,rxpX)
            end,
            GetMapWorldSize=function(mapID) return width,height end,
          }

          local MG={}
          assert(loadfile("world of warcraft/MewthischGuides/ForeverAPI.lua"))(
            "MewthischGuides",MG)

          local map=assert(MG.ForeverAPI:RestedXPWorldToMap(
            1412,-259.85,-2914.28))
          assert(math.abs(map.x-.4492)<.0002,
            string.format("Mulgore x mismatch %.6f",map.x))
          assert(math.abs(map.y-.7712)<.0002,
            string.format("Mulgore y mismatch %.6f",map.y))

          local world=assert(MG.ForeverAPI:MapToRestedXPWorld(
            1412,.443,.798))
          assert(math.abs(world.x-(left-width*.443))<.01)
          assert(math.abs(world.y-(top-height*.798))<.01)

          -- Exact runtime evidence from the Mulgore recorder session:
          -- player at 44.2845 / 79.7912 while "Die Jagd beginnt" was active.
          local observed=assert(MG.ForeverAPI:MapToRestedXPWorld(
            1412,.4428451061248779,.797911524772644))
          assert(math.abs(observed.x-(-227.2167327))<.05)
          assert(math.abs(observed.y-(-3005.7669723))<.05)

          local function distance(x,y)
            local dx=x-observed.x
            local dy=y-observed.y
            return math.sqrt(dx*dx+dy*dy)
          end
          assert(distance(-228.2,-3006.0)<2,
            "runtime Mulgore loop point must be near the player")
          assert(distance(-385.2,-3117.38)>190,
            "old first-loop point must not masquerade as the live target")

          local nearMap=assert(MG.ForeverAPI:RestedXPWorldToMap(
            1412,-228.2,-3006.0))
          assert(math.abs(nearMap.x-.4430364963)<.0002)
          assert(math.abs(nearMap.y-.7979795620)<.0002)
          print("RestedXP world-axis/map-geometry PASS")
          LUA

      - name: Validate quest progress tracking
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={runtime={}}}
          C_QuestLog=nil
          GetNumQuestLogEntries=function() return 1,1 end
          GetQuestLogTitle=function(index)
            return "Legacy Quest",7,0,false,false,false,0,12345
          end
          GetNumQuestLeaderBoards=function(index) return 1 end
          GetQuestLogLeaderBoard=function(objective,index)
            return "Testgegner: 3/5","monster",false
          end
          IsQuestFlaggedCompleted=function() return false end

          assert(loadfile("world of warcraft/MewthischGuides/QuestTracking.lua"))(
            "MewthischGuides",MG)

          local snapshot=MG.QuestTracking:Refresh("unit")
          assert(snapshot[12345],"legacy quest missing")
          assert(snapshot[12345].trackingSource=="LegacyQuestLog")
          assert(snapshot[12345].objectives[1].numFulfilled==3)
          assert(snapshot[12345].objectives[1].numRequired==5)
          print("Quest progress tracking PASS")
          LUA

      - name: Validate auto-route resync and objective progression
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            Data={guide={id="test",steps={
              {id="q1",order=10,questID=1,title="Q1",faction="Horde"},
              {id="q2",order=20,questID=2,title="Q2",faction="Horde"},
              {id="q3",order=30,questID=3,title="Q3",faction="Horde"},
            }}},
            db={settings={routeMode="auto"},runtime={}},
          }
          assert(loadfile("world of warcraft/MewthischGuides/GoalEngine.lua"))("MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/StepEngine.lua"))("MewthischGuides",MG)

          MG.GetPlayerProfile=function()
            return {faction="Horde",race="Troll",class="HUNTER",level=8}
          end
          MG.Log=function() end
          MG.IsQuestFlaggedCompletedSafe=function(_,questID) return questID==1 end
          MG.GetQuestLogSnapshot=function()
            return {
              [2]={questID=2,title="Q2",level=2,questLogIndex=1,readyForTurnIn=false,
                objectives={{type="monster",text="Boar: 2/10",numFulfilled=2,numRequired=10,finished=false}}},
              [3]={questID=3,title="Q3",level=3,questLogIndex=2,readyForTurnIn=false,
                objectives={{type="item",text="Thing: 1/2",numFulfilled=1,numRequired=2,finished=false}}},
            }
          end

          local steps,preferredIndex,reason=MG:BuildGuideSteps()
          assert(#steps==2)
          assert(steps[preferredIndex].questID==3,
            "auto-route resync must choose furthest active route quest")
          assert(reason=="furthest_active_route_quest")
          print("Auto-route resync PASS")
          LUA

      - name: Validate manual nearest-target routing
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            db={settings={routeMode="manual"},runtime={}},
            StepPhases={OBJECTIVES="objectives",TURNIN="turnin"},
            Log=function() end,
          }
          MG.GetQuestLogSnapshot=function()
            return {
              [1]={questID=1,title="Far",questLogIndex=1,readyForTurnIn=false,objectives={}},
              [2]={questID=2,title="Near",questLogIndex=2,readyForTurnIn=false,objectives={}},
            }
          end
          MG.BuildLiveFallbackStep=function(_,entry)
            return {questID=entry.questID,questLogIndex=entry.questLogIndex,
              phase="objectives",title=entry.title}
          end
          MG.ForeverAPI={GetPlayerPosition=function() return {mapID=1,x=.5,y=.5} end}
          MG.RouteEngine={
            Resolve=function(_,step)
              local x=step.questID==1 and .9 or .55
              return {mapID=1,x=x,y=.5,source="QuestMapPOI"}
            end,
            EstimateDistanceToTarget=function(_,target)
              return math.abs(target.x-.5),"normalized_map"
            end,
          }

          assert(loadfile("world of warcraft/MewthischGuides/ManualRoute.lua"))(
            "MewthischGuides",MG)
          local steps,index,reason=MG:BuildManualRouteSteps()
          assert(#steps==2 and index==1)
          assert(steps[1].questID==2,"manual mode did not choose nearest active quest")
          assert(reason=="manual_nearest_active_quest")
          print("Manual routing PASS")
          LUA

      - name: Validate RouteEngine and RestedXP objective target
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={
            db={runtime={}},
            Log=function() end,
            GetPlayerProfile=function() return {faction="Horde",race="Orc",class="HUNTER"} end,
          }
          assert(loadfile("world of warcraft/MewthischGuides/RouteEngine.lua"))("MewthischGuides",MG)
          MG.ForeverAPI={
            GetPlayerPosition=function() return {mapID=1411,x=.1,y=.1} end,
            GetQuestLineCoordinate=function() return nil end,
            FindQuestOnMaps=function()
              return {mapID=1411,x=.4,y=.6,source="QuestMapPOI",phaseMatch=true}
            end,
            GetNextQuestWaypoint=function() return nil end,
            GetLegacyQuestPOI=function() return nil end,
            GetNavigationCoordinate=function() return nil end,
            MapToWorld=function() return nil end,
          }
          MG.RestEDXPImport={
            GetCoordinate=function(_,definition,phase,profile,objective)
              assert(objective==2,"objective index not forwarded to RestedXP")
              return {mapID=1411,x=.2,y=.3,source="RestedXPPublicRouteData",phaseMatch=true}
            end,
          }

          local target=MG.RouteEngine:Resolve({
            questID=789,phase="objectives",verification="RESTEDXP_PUBLIC",
            definition={rxpOccurrences={{}}},goal={index=2},
          })
          assert(target and target.source=="RestedXPPublicRouteData")
          assert(target.score==99)
          print("RouteEngine objective target PASS")
          LUA

      - name: Validate RestedXP progress occurrence
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={rxpSeason=0,rxpRate=1,rxpHardcoreMode=false,rxpSoDMode=false}}}
          for i=1,5 do
            assert(loadfile(string.format(
              "world of warcraft/MewthischGuides/RestedXPForeverData_%02d.lua",i)))(
                "MewthischGuides",MG)
          end
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPActionCatalog.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPImport.lua"))(
            "MewthischGuides",MG)

          local stats=MG.RestEDXPImport:GetStats()
          assert(stats.sourceFiles==27)
          assert(stats.rawGuides>=95)
          assert(stats.rawSteps>12000)
          assert(stats.structuredActions>50000)
          assert(stats.unknownActionKinds==0)
          assert(stats.unknownActions==0)
          assert(stats.sourceCommit=="a688a75d595f5884dba8044a5ba4e7d7bd859c09")

          local synthetic={
            order=100,
            rxpOccurrences={
              {phase="accept",sourceStep=1,sourceAction=1,tags={}},
              {phase="objectives",objective=1,sourceStep=5,sourceAction=2,tags={}},
              {phase="objectives",objective=2,sourceStep=8,sourceAction=3,tags={}},
              {phase="turnin",sourceStep=10,sourceAction=1,tags={}},
            },
          }
          local profile={faction="Horde",race="Orc",class="HUNTER",level=3}
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"objectives",profile,1)==502)
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"objectives",profile,2)==803)
          assert(MG.RestEDXPImport:GetProgressOrder(synthetic,"complete",profile,nil)==1001)

          MG.ForeverAPI={
            GetPlayerPosition=function() return {mapID=1412,x=.443,y=.798} end,
            MapToRestedXPWorld=function()
              return {continentID=1,x=-228.3,y=-3006.1}
            end,
          }
          local loopDefinition={
            rxpOccurrences={{
              phase="objectives",objective=1,sourceStep=20,sourceAction=9,tags={},
              coordinate={mapID=1412,worldX=-385.2,worldY=-3117.38,
                source="RestedXPPublicRouteData"},
              routeCoordinates={
                {mapID=1412,worldX=-385.2,worldY=-3117.38,
                  source="RestedXPPublicRouteData"},
                {mapID=1412,worldX=-259.85,worldY=-2914.28,
                  source="RestedXPPublicRouteData"},
                {mapID=1412,worldX=-228.2,worldY=-3006.0,
                  source="RestedXPPublicRouteData"},
              },
            }},
          }
          local nearest=assert(MG.RestEDXPImport:GetCoordinate(
            loopDefinition,"objectives",profile,1))
          assert(nearest.rxpRoutePointIndex==3,
            "objective loop did not choose nearest waypoint")
          assert(nearest.rxpRoutePointCount==3)
          print("RestedXP progress occurrence PASS")
          LUA

      - name: Validate supported Forever route catalog and auto readiness
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={
            rxpSeason=0,rxpRate=1,rxpHardcoreMode=false,rxpSoDMode=false,
            routeMode="manual",
          },runtime={}}}
          for i=1,5 do
            assert(loadfile(string.format(
              "world of warcraft/MewthischGuides/RestedXPForeverData_%02d.lua",i)))(
                "MewthischGuides",MG)
          end
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPActionCatalog.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPImport.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/GuideRegistry.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/SupportedRoutes.lua"))(
            "MewthischGuides",MG)

          local guides=MG.RestEDXPImport:BuildGuides()
          local stats=MG.RestEDXPImport:GetStats()
          local status=MG.SupportedRoutes:Validate(guides,stats.sourceCommit)
          assert(status.ready,"supported RestedXP route catalog must be complete")
          assert(status.requiredRoutes==43)
          assert(status.resolvedRoutes==43)
          assert(#status.missing==0 and #status.duplicates==0)

          local horde=MG.SupportedRoutes:GetGuides("horde")
          local ally=MG.SupportedRoutes:GetGuides("ally")
          local mage=MG.SupportedRoutes:GetGuides("mage")
          assert(#horde==18,"unexpected Horde route count")
          assert(#ally==19,"unexpected Ally route count")
          assert(#mage==7,"unexpected Mage AoE route count")

          local function sorted(list)
            for i=2,#list do
              local a,b=list[i-1],list[i]
              local amin,bmin=tonumber(a.minLevel) or 999,tonumber(b.minLevel) or 999
              assert(amin<=bmin,"routes are not level-sorted")
            end
          end
          sorted(horde); sorted(ally); sorted(mage)

          local names={}
          for _,guide in ipairs(guides) do
            names[(guide.sourceFile or "").."|"..(guide.title or "")]=true
          end
          local required={
            "Guides/Forever/RestedXP-Skyborne.lua|1-14 Zephras Isle",
            "Guides/forever/Alliance-1-10_NightElf.lua|1-6 Shadowglen",
            "Guides/forever/Alliance-1-10_NightElf.lua|6-11 Teldrassil",
            "Guides/forever/Alliance-1-13_Human.lua|1-6 Northshire",
            "Guides/forever/Alliance-1-13_Human.lua|6-11 Elwynn Forest",
            "Guides/forever/Alliance-1-13_Human.lua|11-13 Loch Modan",
            "Guides/forever/Horde-01-14_Undead.lua|1-6 Tirisfal Glades",
            "Guides/forever/Horde-01-14_Undead.lua|6-11 Tirisfal Glades",
            "Guides/forever/Horde-01-14_Undead.lua|12-14 Silverpine Forest",
            "Guides/forever/Horde-1-12_Mulgore.lua|1-6 Mulgore",
            "Guides/forever/Horde-1-12_Mulgore.lua|6-12 Mulgore",
            "Guides/forever/Horde-Mage-12-21.lua|12-17 The Barrens AoE",
            "Guides/forever/Horde-Mage-12-21.lua|17-21 Stonetalon/Barrens AoE",
          }
          for _,key in ipairs(required) do assert(names[key],"missing route "..key) end
          print("Supported Forever route catalog PASS")
          LUA

      - name: Validate all-quest auto accept and turn-in defaults
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local calls={accept=0,complete=0,reward=0,gossip=0}
          local MG={
            db={settings={autoAcceptQuests=true,autoTurnInQuests=true}},
            Log=function() end,
            RefreshUI=function() end,
          }
          GetTime=function() return 10 end
          GetQuestID=function() return 999 end
          AcceptQuest=function() calls.accept=calls.accept+1 end
          IsQuestCompletable=function() return true end
          CompleteQuest=function() calls.complete=calls.complete+1 end
          GetNumQuestChoices=function() return 0 end
          GetQuestReward=function() calls.reward=calls.reward+1 end
          C_GossipInfo={
            GetActiveQuests=function() return {} end,
            SelectActiveQuest=function() end,
            GetAvailableQuests=function()
              return {{questID=777,title="Any Quest",isIgnored=false}}
            end,
            SelectAvailableQuest=function(id)
              assert(id==777); calls.gossip=calls.gossip+1
            end,
          }

          assert(loadfile("world of warcraft/MewthischGuides/QuestAutomation.lua"))(
            "MewthischGuides",MG)
          MG:HandleQuestAutomationEvent("QUEST_DETAIL")
          MG:HandleQuestAutomationEvent("QUEST_PROGRESS")
          MG:HandleQuestAutomationEvent("QUEST_COMPLETE")
          MG.automationBusyUntil=0
          MG:HandleQuestAutomationEvent("GOSSIP_SHOW")

          assert(calls.accept==1,"all-quest auto accept failed")
          assert(calls.complete==1,"all-quest auto complete failed")
          assert(calls.reward==1,"all-quest auto turn-in failed")
          assert(calls.gossip==1,"available gossip quest was not selected")
          print("All-quest automation PASS")
          LUA

      - name: Validate guide picker policy and Mulgore Call of Earth routing
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={
            rxpSeason=0,rxpRate=1,rxpHardcoreMode=false,rxpSoDMode=false,
          },runtime={}}}
          for i=1,5 do
            assert(loadfile(string.format(
              "world of warcraft/MewthischGuides/RestedXPForeverData_%02d.lua",i)))(
                "MewthischGuides",MG)
          end
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPActionCatalog.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/RestedXPImport.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/GuideRegistry.lua"))(
            "MewthischGuides",MG)
          assert(loadfile("world of warcraft/MewthischGuides/SupportedRoutes.lua"))(
            "MewthischGuides",MG)

          local guides=MG.RestEDXPImport:BuildGuides()
          local status=MG.SupportedRoutes:Validate(
            guides,MG.RestEDXPImport:GetStats().sourceCommit)
          assert(status.ready)

          local function find(title)
            for _,g in ipairs(guides) do
              if g.title==title then return g end
            end
          end

          local mulgore=assert(find("1-6 Mulgore"))
          local durotar=assert(find("1-6 Durotar"))
          local northshire=assert(find("1-6 Northshire"))
          local mageHorde=assert(find("12-17 The Barrens AoE"))

          MG.GetPlayerProfile=function()
            return {faction="Horde",race="Tauren",class="DRUID",level=2}
          end
          assert(loadfile("world of warcraft/MewthischGuides/DataLoader.lua"))(
            "MewthischGuides",MG)
          MG.DataLoader.byID={}
          for _,g in ipairs(guides) do MG.DataLoader.byID[g.id]=g end

          assert(MG.DataLoader:IsGuideSelectable(mulgore,"horde"))
          assert(MG.DataLoader:IsGuideSelectable(durotar,"horde"),
            "Horde character must be able to select every Horde route")
          assert(not MG.DataLoader:IsGuideSelectable(northshire,"ally"))
          assert(not MG.DataLoader:CanSelectCategory("mage"),
            "non-Mage must not be able to select Mage AoE category")

          MG.GetPlayerProfile=function()
            return {faction="Horde",race="Tauren",class="MAGE",level=2}
          end
          assert(MG.DataLoader:CanSelectCategory("mage"))
          assert(MG.DataLoader:IsGuideSelectable(mageHorde,"mage"))

          local call
          for _,def in ipairs(mulgore.steps or {}) do
            if def.questID==1519 then call=def break end
          end
          assert(call,"Mulgore quest 1519 missing")
          assert(call.classSpecific==true,
            "Call of Earth must be marked class-specific")
          assert(type(call.classes)=="table" and #call.classes==1 and
            call.classes[1]=="SHAMAN",
            "Call of Earth must be marked SHAMAN-only")

          local classStats=MG.RestEDXPImport:GetClassSpecificQuestStats(guides)
          assert(classStats.total>0,"quest classification audit saw no quests")
          assert(classStats.classSpecific>0,
            "quest classification audit found no class-specific quests")
          local knownClasses={
            WARRIOR=true,PALADIN=true,HUNTER=true,ROGUE=true,PRIEST=true,
            SHAMAN=true,MAGE=true,WARLOCK=true,DRUID=true,
          }
          for _,guide in ipairs(guides) do
            for _,def in ipairs(guide.steps or {}) do
              if def.classSpecific then
                assert(type(def.classes)=="table" and #def.classes>0,
                  "class-specific quest missing classes: "..tostring(def.questID))
                for _,classFile in ipairs(def.classes) do
                  assert(knownClasses[classFile],
                    "unknown class marker on quest "..tostring(def.questID))
                end
                assert(def.classRestrictionSource=="accept" or
                  def.classRestrictionSource=="all_occurrences",
                  "class-specific quest missing restriction source")
              end
            end
          end

          local druid={faction="Horde",race="Tauren",class="DRUID",level=2}
          local shaman={faction="Horde",race="Tauren",class="SHAMAN",level=2}
          assert(MG.RestEDXPImport:GetProgressOccurrence(
            call,"accept",druid,nil)==nil,
            "Druid must not receive Shaman-only Call of Earth accept step")
          local occ=assert(MG.RestEDXPImport:GetProgressOccurrence(
            call,"accept",shaman,nil),
            "Shaman Call of Earth accept occurrence missing")
          assert(occ.coordinate and occ.coordinate.mapID==1412)
          assert(math.abs(occ.coordinate.worldX-(-250.09))<0.01)
          assert(math.abs(occ.coordinate.worldY-(-2882.08))<0.01)

          MG.StepPhases={ACCEPT="accept",TURNIN="turnin"}
          assert(loadfile("world of warcraft/MewthischGuides/StepEngine.lua"))(
            "MewthischGuides",MG)
          assert(not MG:RestedXPPhaseApplies(call,"accept",druid,nil))
          assert(MG:RestedXPPhaseApplies(call,"accept",shaman,nil))

          print(string.format(
            "Guide picker + class quest audit PASS (%d/%d class-specific)",
            classStats.classSpecific,classStats.total))
          LUA

      - name: Validate v0.12 localization, registry and settings schema
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local MG={db={settings={language="auto"},runtime={}}}
          GetLocale=function() return "ruRU" end
          assert(loadfile("world of warcraft/MewthischGuides/Localization.lua"))(
            "MewthischGuides",MG)
          assert(MG.Localization:DetectClientLanguage()=="ru")
