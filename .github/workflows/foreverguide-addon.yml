name: Mewthisch Guides addon v0.3

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides/**"
      - ".github/workflows/foreverguide-addon.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate Step 1 contract
        shell: bash
        run: |
          grep -q '^## Interface: 16001$' "world of warcraft/MewthischGuides/MewthischGuides.toc"
          grep -q '^## Title: Mewthisch Guides$' "world of warcraft/MewthischGuides/MewthischGuides.toc"
          grep -q '^## Version: 0.3.0$' "world of warcraft/MewthischGuides/MewthischGuides.toc"
          grep -q '^## SavedVariables: MewthischGuidesDB$' "world of warcraft/MewthischGuides/MewthischGuides.toc"
          grep -q '^Navigator.lua$' "world of warcraft/MewthischGuides/MewthischGuides.toc"
          grep -q 'YARDS_TO_METERS = 0.9144' "world of warcraft/MewthischGuides/Navigation.lua"
          grep -q 'MewthischGuidesNavigatorFrame' "world of warcraft/MewthischGuides/Navigator.lua"
          grep -q 'SLASH_MEWTHISCHGUIDES1 = "/mg"' "world of warcraft/MewthischGuides/Core.lua"
          grep -q 'MewthischGuidesMinimapButton' "world of warcraft/MewthischGuides/UI.lua"

      - name: Package addon
        shell: bash
        run: |
          mkdir -p artifacts/MewthischGuides
          cp -R "world of warcraft/MewthischGuides/"* artifacts/MewthischGuides/
          cd artifacts
          zip -r MewthischGuides-v0.3.zip MewthischGuides

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides-v0.3
          path: artifacts/MewthischGuides-v0.3.zip
          if-no-files-found: error
