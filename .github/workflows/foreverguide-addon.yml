name: ForeverGuide addon v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/ForeverGuide/**"
      - ".github/workflows/foreverguide-addon.yml"
  pull_request:
    paths:
      - "world of warcraft/ForeverGuide/**"
      - ".github/workflows/foreverguide-addon.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/ForeverGuide" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate TOC
        shell: bash
        run: |
          grep -q '^## Interface: 16001$' "world of warcraft/ForeverGuide/ForeverGuide.toc"
          grep -q '^## Version: 0.1.0$' "world of warcraft/ForeverGuide/ForeverGuide.toc"
          grep -q '^## SavedVariables: ForeverGuideDB$' "world of warcraft/ForeverGuide/ForeverGuide.toc"

      - name: Package addon
        shell: bash
        run: |
          mkdir -p artifacts/ForeverGuide
          cp -R "world of warcraft/ForeverGuide/"* artifacts/ForeverGuide/
          cd artifacts
          zip -r ForeverGuide-v0.1.zip ForeverGuide

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: ForeverGuide-v0.1
          path: artifacts/ForeverGuide-v0.1.zip
          if-no-files-found: error
