          grep -q 'Русский' "$ROOT/Localization.lua"
          grep -q 'हिन्दी' "$ROOT/Localization.lua"
          grep -q 'a688a75d595f5884dba8044a5ba4e7d7bd859c09' "$ROOT/GuideRegistry.lua"
          grep -q 'RegisterRoute' "$ROOT/GuideRegistry.lua"

          grep -q 'routeMode = "auto"' "$ROOT/Logger.lua"
          grep -q 'smartResync = true' "$ROOT/Logger.lua"
          grep -q 'skipObsoleteSteps = true' "$ROOT/Logger.lua"
          grep -q 'language = "auto"' "$ROOT/Logger.lua"
