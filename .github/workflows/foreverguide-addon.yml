      - name: Package addon
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/MewthischGuides
          cp -R "world of warcraft/MewthischGuides/"* artifacts/MewthischGuides/
          cd artifacts
          zip -r MewthischGuides-v0.12.0.zip MewthischGuides

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: MewthischGuides-v0.12.0
          path: artifacts/MewthischGuides-v0.12.0.zip
          if-no-files-found: error
