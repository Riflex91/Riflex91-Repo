      - name: Validate better-gear auto-equip
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local pickupCalls,equipSlot,equipByNameSlot=0,nil,nil
          local noticeCalls=0
          local equippedIDs={}
          Enum={ItemClass={Armor=4},ItemBind={OnEquip=2}}
          local MG={
            Data={gearProfiles={}},
            db={settings={
              gearAutoEquip=true,
              gearRequireHighConfidence=true,
              gearAutoEquipItemLevelFallback=true,
              gearAutoEquipWeapons=false,
              gearProtectBoE=true,
            },runtime={}},
            BuildState={GetState=function()
              return {class="DRUID",level=1}
            end},
            Inventory={GetSnapshot=function() return {bags={},equipped={}} end},
            Log=function() end,
            ShowAutoEquipNotification=function(_,item)
              assert(item and item.itemID,"notification item missing")
              noticeCalls=noticeCalls+1
            end,
          }

          GetItemInfoInstant=function(link)
            if link=="frayed-pants" then
              return 1378,"Armor","Cloth","INVTYPE_LEGS",0,4,1
            elseif link=="novice-pants" then
              return 6124,"Armor","Cloth","INVTYPE_LEGS",0,4,1
            elseif link=="mail-gloves" then
              return 2653,"Armor","Mail","INVTYPE_HAND",0,4,3
            elseif link=="nomad-belt" or link==4954 then
              return 4954,"Armor","Leather","INVTYPE_WAIST",0,4,2
            end
            return 1001,"Armor","Leather","INVTYPE_CHEST",0,4,2
          end
          GetDetailedItemLevelInfo=function(link)
            if link=="frayed-pants" or link=="novice-pants" then return 1 end
            if link=="mail-gloves" then return 2 end
            if link=="nomad-belt" then return 5 end
            if link=="candidate" then return 20 end
            if link=="equipped" then return 10 end
          end
          GetItemStats=function(link)
            if link=="frayed-pants" then return {RESISTANCE0_NAME=4} end
            if link=="novice-pants" then return {RESISTANCE0_NAME=2} end
            if link=="mail-gloves" then return {RESISTANCE0_NAME=35} end
            if link=="nomad-belt" then return {RESISTANCE0_NAME=19} end
            return {}
          end
          IsEquippableItem=function() return false end
          IsUsableItem=function() return false end
          GetInventoryItemLink=function(_,slot)
            if slot==7 then return "novice-pants" end
            if slot==5 then return "equipped" end
          end
          GetInventoryItemID=function(_,slot) return equippedIDs[slot] end
          C_Container={PickupContainerItem=function() pickupCalls=pickupCalls+1 end}
          EquipCursorItem=function(slot) equipSlot=slot end
          EquipItemByName=function(link,slot)
            equipByNameSlot=slot
            if link=="frayed-pants" then equippedIDs[slot]=1378
            elseif link=="candidate" then equippedIDs[slot]=1001 end
          end

          assert(loadfile("world of warcraft/MewthischGuides/GearAdvisor.lua"))(
            "MewthischGuides",MG)

          local pants=assert(MG.GearAdvisor:EvaluateItemLink("frayed-pants"))
          assert(pants.upgrade and pants.scoreModel=="strict-stat-dominance")
          assert(pants.slot==7 and pants.statDelta==2)

          local belt=assert(MG.GearAdvisor:EvaluateItemLink("nomad-belt"))
          assert(belt.upgrade and belt.slot==6,
            "empty waist slot must accept the Nomad belt candidate")
          assert(belt.equipDiagnostics and
                 belt.equipDiagnostics.usedEquipLocFallback==true,
            "valid INVTYPE_WAIST must survive false equippable helper results")

          local rejected,rejectReason=MG.GearAdvisor:EvaluateItemLink("mail-gloves")
          assert(rejected==nil and rejectReason=="armor_proficiency",
            "Druid must not auto-equip mail")

          pants.bag,pants.bagSlot,pants.isBound,pants.bindingType=0,1,false,0
          local requested,reason=MG.GearAdvisor:TryAutoEquip(pants)
          assert(requested and reason=="equipped_confirmed")
          assert(equipByNameSlot==7,"EquipItemByName path not used")
          assert(pickupCalls==0 and equipSlot==nil,
            "cursor fallback should not run when EquipItemByName succeeds")
          assert(noticeCalls==1,
            "confirmed auto-equip must show exactly one item notification")

          pants.isBound=false
          pants.bindingType=2
          requested,reason=MG.GearAdvisor:TryAutoEquip(pants)
          assert(not requested and reason=="boe_protected")

          pants.bindingType=nil
          requested,reason=MG.GearAdvisor:TryAutoEquip(pants)
          assert(not requested and reason=="binding_unknown")
          print("Better-gear auto-equip PASS")
          LUA

