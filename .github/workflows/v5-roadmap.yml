name: v5-roadmap

# Manuelle Offline-Diagnose; reale Funktionsfreigaben kommen aus Ingame-Tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-offline-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Roadmap und Verfassung diagnostizieren
        run: |
          node v5/werkzeuge/roadmap-pruefen.mjs
          node v5/werkzeuge/r2-verfassung-pruefen.mjs
