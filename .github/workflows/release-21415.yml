name: release-21415
on:
  push:
    branches: ["hotfix/2.14.15-bank-lease-diagnostics"]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[release-21415]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/2.14.15-bank-lease-diagnostics
          fetch-depth: 0
      - name: Verify exact 2.14.14 base
        run: |
          set -euo pipefail
          BASE=38aae2a22f2f2c4f0b54352bc59937d792c74f4e
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object bot.js)" = "cfcf6c2f5a4235bab4d8dc8989325f4eea0d201a"
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^(scripts/patch-21415\.py|\.github/workflows/release-21415\.yml)$' || true)"
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
      - name: Apply 2.14.15 patch
        run: python3 scripts/patch-21415.py
      - name: Adjust retained bank smoke extractor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-21413-merchant-stability.js')
          s=p.read_text(encoding='utf-8')
          old="const end=bot.indexOf('\\n\\n  v2148BankCleanupTick=function',start);"
          new="const end=bot.indexOf('\\n  function v21415BankCleanupLeaseExpired',start);"
          if s.count(old)!=1: raise SystemExit(f'retained extractor marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check bot and worker
        run: |
          node --check bot.js
          node --check cloudflare-dashboard/src/worker.js
      - name: Syntax check dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('cloudflare-dashboard/dashboard.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('dashboard script missing')
          Path('/tmp/dashboard.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Run all smoke tests
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js scripts/smoke*.mjs; do
            [ -f "$f" ] || continue
            echo "==> $f"
            node "$f"
          done
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js version.json cloudflare-dashboard scripts
          git rm -f scripts/patch-21415.py .github/workflows/release-21415.yml
          git diff --cached --check
          git commit -m "Release 2.14.15: Bank progress lease diagnostics [release-21415]"
          git push origin HEAD:hotfix/2.14.15-bank-lease-diagnostics
