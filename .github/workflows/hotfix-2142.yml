name: One-shot 2.14.2 Merchant Recursion Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2142.yml"
      - "scripts/apply-2.14.2-merchant-recursion-fix.py"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply 2.14.2 Merchant recursion fix
        run: python scripts/apply-2.14.2-merchant-recursion-fix.py
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Syntax and release contract
        run: node scripts/verify-release.js
      - name: Student neural-network smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger rollback smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality guard smoke
        run: node scripts/smoke-quality.js
      - name: AiO Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Merchant stability and recursion smoke
        run: node scripts/smoke-merchant-stability.js
      - name: Cloudflare Brain API smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.2 if tests passed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js version.json README.md BOT_README.md scripts/verify-release.js scripts/smoke-research.js scripts/smoke-merchant-stability.js
          if git diff --cached --quiet; then
            echo "No release changes to publish."
            exit 0
          fi
          git commit -m "Release 2.14.2 merchant recursion fix"
          git push origin HEAD:main
