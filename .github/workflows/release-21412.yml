name: release-21412
on:
  push:
    branches: [hotfix/2.14.12-merchant-brain-dashboard]
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/2.14.12-merchant-brain-dashboard
          fetch-depth: 0
      - name: Apply deterministic 2.14.12 patch
        run: python3 scripts/patch-21412.py
      - name: Align dashboard package, terrain overlay, worker and retained smoke metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          dash_path=Path('cloudflare-dashboard/dashboard.html')
          worker_path=Path('cloudflare-dashboard/src/worker.js')
          pkg_path=Path('cloudflare-dashboard/package.json')
          dash=dash_path.read_text(encoding='utf-8')
          dash=dash.replace('<svg id="map" aria-label="Live Positionskarte">','<svg id="map" preserveAspectRatio="none" aria-label="Live Positionskarte">',1)
          dash_path.write_text(dash,encoding='utf-8')
          worker=worker_path.read_text(encoding='utf-8')
          start=worker.index('const DASHBOARD_HTML = ')
          q=worker.index('"',start)
          i=q+1
          while i<len(worker):
              if worker[i]=='\\': i+=2; continue
              if worker[i]=='"' and i+1<len(worker) and worker[i+1]==';':
                  end=i+2; break
              i+=1
          else:
              raise SystemExit('worker DASHBOARD_HTML terminator missing')
          worker=worker[:start]+'const DASHBOARD_HTML = '+json.dumps(dash,ensure_ascii=False)+';'+worker[end:]
          worker=worker.replace('2.14.11','2.14.12')
          worker_path.write_text(worker,encoding='utf-8')
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version']='2.14.12'
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for p in Path('scripts').glob('smoke*'):
              if not p.is_file() or p.suffix not in ('.js','.mjs'): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace(r'2\.14\.11',r'2\.14\.12')
              if p.name=='smoke-21411-brain-world.js':
                  s=s.replace("assert(s.includes('Lernhinweise / Stichworte')&&s.includes('sie führen niemals fremden Code aus'),'keyword teaching is non-executable');","assert(s.includes('Vermutungen & Lernhinweise')&&s.includes('niemals Code erzeugt oder ausgeführt'),'keyword teaching is non-executable');")
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check bot and worker
        run: |
          node --check bot.js
          node --check cloudflare-dashboard/src/worker.js
      - name: Syntax check dashboard script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('cloudflare-dashboard/dashboard.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('dashboard script missing')
          Path('/tmp/dashboard.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Verify prepared release
        run: node scripts/verify-release.js
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js scripts/smoke*.mjs; do
            [ -f "$f" ] || continue
            echo "==> $f"
            node "$f"
          done
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested release and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js version.json cloudflare-dashboard scripts
          git rm -f scripts/patch-21412.py .github/workflows/release-21412.yml
          git commit -m "Release 2.14.12: Fix Merchant bank sync and add learning dashboard [release-21412]"
          git push origin HEAD:hotfix/2.14.12-merchant-brain-dashboard
