name: v5-pr20-7-gear

on:
  push:
    paths:
      - 'v5/werkzeuge/pr20-7-gear-swap-produktions-browser.mjs'
      - 'v5/werkzeuge/pr20-7-gear-swap-produktions-preflight.mjs'
      - 'v5/grundlage/tests/pr20-gear-swap-browser-preflight.test.mjs'
      - 'v5/grundlage/quelle/equipment/pr20-7-gear-swap-vorbereitung.ts'
      - 'v5/grundlage/quelle/merchant/gear-allokation.ts'
      - 'v5/grundlage/quelle/merchant/gear-progression.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/vertraege/runtime/pr20-7-gear-production-preparation.json'
      - 'v5/grundlage/vertraege/runtime/merchant-remaining-production-preparation.json'
      - 'v5/grundlage/tests/pr20-gear-swap-preparation.test.mjs'
      - 'v5/grundlage/tests/r15-gear-progression.test.mjs'
      - 'v5/grundlage/tests/pr20-merchant-remaining-production-preparation.test.mjs'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/dokumentation/PR20-7-GEAR-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/package.json'
      - '.github/workflows/v5-pr20-7-gear.yml'
  pull_request:
    paths:
      - 'v5/werkzeuge/pr20-7-gear-swap-produktions-browser.mjs'
      - 'v5/werkzeuge/pr20-7-gear-swap-produktions-preflight.mjs'
      - 'v5/grundlage/tests/pr20-gear-swap-browser-preflight.test.mjs'
      - 'v5/grundlage/quelle/equipment/pr20-7-gear-swap-vorbereitung.ts'
      - 'v5/grundlage/quelle/merchant/gear-allokation.ts'
      - 'v5/grundlage/quelle/merchant/gear-progression.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/vertraege/runtime/pr20-7-gear-production-preparation.json'
      - 'v5/grundlage/vertraege/runtime/merchant-remaining-production-preparation.json'
      - 'v5/grundlage/tests/pr20-gear-swap-preparation.test.mjs'
      - 'v5/grundlage/tests/r15-gear-progression.test.mjs'
      - 'v5/grundlage/tests/pr20-merchant-remaining-production-preparation.test.mjs'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/dokumentation/PR20-7-GEAR-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/package.json'
      - '.github/workflows/v5-pr20-7-gear.yml'

permissions:
  contents: read

jobs:
  gear-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - run: npm ci
      - run: npm run merchant-pr20-7-prep:pruefen
