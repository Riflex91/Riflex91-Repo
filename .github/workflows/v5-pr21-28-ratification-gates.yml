name: v5-pr21-28-ratification-gates

on:
  push:
    paths:
      - 'v5/grundlage/quelle/zertifizierung/pr21-28-result-package.ts'
      - 'v5/grundlage/quelle/zertifizierung/pr21-28-ratification-record.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-gate-advance-proposal.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-ratification-gate-proposals.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-ratification-gate-proposals.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - '.github/workflows/v5-pr21-28-ratification-gates.yml'
  pull_request:
    paths:
      - 'v5/grundlage/quelle/zertifizierung/pr21-28-result-package.ts'
      - 'v5/grundlage/quelle/zertifizierung/pr21-28-ratification-record.ts'
      - 'v5/grundlage/quelle/runtime/pr21-28-gate-advance-proposal.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-ratification-gate-proposals.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-ratification-gate-proposals.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - '.github/workflows/v5-pr21-28-ratification-gates.yml'

permissions:
  contents: read

jobs:
  ratification-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - run: npm ci
      - run: npm run bauen
      - run: node --test grundlage/tests/pr21-28-ratification-gate-proposals.test.mjs
      - run: npm run post-pr20-foundations:pruefen
