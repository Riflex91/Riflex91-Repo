name: One-shot 2.14.4 Merchant Economy Party UI Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2144.yml"
      - "scripts/apply-2.14.4-merchant-economy-party-ui.py"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 2.14.4 Merchant economy / party realm / GUI fix
        run: python scripts/apply-2.14.4-merchant-economy-party-ui.py
      - name: Correct generated Merchant smoke selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-merchant-stability.js')
          s=p.read_text(encoding='utf-8')
          old="assert.ok(!bot.includes(\"if(character.ctype!=='merchant'||!C.merchantSellTrashToNpc||!S.bankFull||typeof sell!=='function')\"),'NPC selling must not require a full bank');"
          new="const sellOverridePos=bot.lastIndexOf(\"v273SellTrashTick=function(){\");\nassert.ok(sellOverridePos>=0,'2.14.4 NPC sell override missing');\nconst sellOverride=bot.slice(sellOverridePos,bot.indexOf(\"\\n  };\",sellOverridePos)+5);\nassert.ok(!sellOverride.includes('!S.bankFull'),'latest NPC sell override must not require a full bank');"
          if old not in s:
              raise SystemExit('generated Merchant smoke selector marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Merchant stability smoke
        run: node scripts/smoke-merchant-stability.js
      - name: 2.14.4 Merchant party UI smoke
        run: node scripts/smoke-2144-merchant-party-ui.js
      - name: Student smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality smoke
        run: node scripts/smoke-quality.js
      - name: Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Cloudflare Worker smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.4 if tests passed
        run: |
          git config user.name "Riflex91"
          git config user.email "hansijuergenlul@gmail.com"
          git add bot.js version.json README.md BOT_README.md scripts/verify-release.js scripts/smoke-merchant-stability.js scripts/smoke-2144-merchant-party-ui.js
          git commit -m "Release 2.14.4: merchant economy party realm and GUI collapse"
          git push origin main
