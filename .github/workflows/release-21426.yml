name: release-21426
on:
  push:
    branches: ["release/2.14.26-merchant-brain-map-update"]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare patcher nested templates and Worker embedding
        shell: bash
        run: |
          python3 - <<'PY'
          p='scripts/apply-21426-merchant-brain-map-update.mjs'
          s=open(p,encoding='utf-8').read()
          start=s.index('  const patch=`')
          end=s.index("`;\n  h=h.replace('</script>'",start)
          segment=s[start:end].replace('${','\\${')
          s=s[:start]+segment+s[end:]
          old="worker=worker.replace(/const DASHBOARD_HTML = [^;]+;/,`const DASHBOARD_HTML = ${JSON.stringify(fs.readFileSync(dashPath,'utf8'))};`);"
          new="worker=worker.replace(/const DASHBOARD_HTML = [\\s\\S]*?;\\n\\n(?=function )/,`const DASHBOARD_HTML = ${JSON.stringify(fs.readFileSync(dashPath,'utf8'))};\\n\\n`);"
          if old not in s: raise SystemExit('worker dashboard embedding line not found')
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Prepare v2.14.26 release tree
        shell: bash
        run: |
          if grep -q "var VERSION = '2.14.26';" bot.js; then
            echo 'Generated release tree already present.'
          else
            node scripts/apply-21426-merchant-brain-map-update.mjs
          fi
      - name: Preserve packed terrain through Worker sanitizer
        run: node scripts/harden-21426-worker-terrain.mjs
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('dashboard JS syntax OK');
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Verify v2.14.26 invariants
        run: node scripts/verify-21426-merchant-brain-map-update.mjs
      - name: Verify Worker packed terrain pass-through
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const w=fs.readFileSync('cloudflare-dashboard/src/worker.js','utf8');
          const a=w.indexOf('function cleanTerrainTuple'),b=w.indexOf('\nfunction cleanLearningFeed',a);
          const ctx={text:(v,max)=>String(v==null?'':v).slice(0,max||500),number:(v,d=0)=>Number.isFinite(Number(v))?Number(v):d};
          vm.createContext(ctx);vm.runInContext(w.slice(a,b),ctx);
          const pc='0,0,0,1s,1s;1,1s,0,3k,1s';
          const t=ctx.cleanTerrain({map:'main',source:'Adventure Land G.geometry/G.tilesets',encoding:'base36-rows-v1',d:0,t:[['forest',0,0,32,32]],p:[],pc,s:{forest:'/images/tiles/map/forest.png'}});
          if(!t||t.omitted||t.pc!==pc||t.encoding!=='base36-rows-v1')throw new Error('packed terrain stripped by Worker');
          console.log('Worker packed terrain pass-through OK');
          NODE
      - name: Normalize historical exact-version/dashboard assertions for smoke only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const f of fs.readdirSync('scripts').filter(x=>/^smoke.*\.js$/.test(x))){
            const p=path.join('scripts',f);let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\.includes\("'"\+([A-Za-z_$][\w$]*)\+"'"\)/g,'.includes($1)');
            s=s.replace(/(assert\.(?:equal|strictEqual)\([^,\n]+,\s*)'2\.14\.\d+'/g,"$1'2.14.26'");
            s=s.replace(/version\.version\s*,\s*'2\.14\.\d+'/g,"version.version,'2.14.26'");
            s=s.replace(/version\.dashboardVersion\s*,\s*'2\.14\.\d+'/g,"version.dashboardVersion,'2.14.26'");
            s=s.replace(/var VERSION = '2\.14\.\d+'/g,"var VERSION = '2.14.26'");
            s=s.replace(/AiO Bot Dashboard 2\.14\.\d+/g,'AiO Bot Dashboard 2.14.26');
            s=s.replace("assert(dash.includes('G.geometry-Kollisionslinien als Vektor-Fallback'));","assert(dash.includes('Adventure Land G.geometry/G.tilesets')); // real terrain only");
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Run complete smoke suite
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do node "$f"; done
          shopt -s nullglob
          for f in scripts/smoke*.mjs; do node "$f"; done
      - name: Restore temporary test edits before diff
        run: git checkout -- scripts/smoke*.js scripts/apply-21426-merchant-brain-map-update.mjs || true
      - name: Diff check
        run: git diff --check
      - name: Commit verified release tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js version.json cloudflare-dashboard/package.json cloudflare-dashboard/dashboard.html cloudflare-dashboard/src/worker.js
          git commit -m 'Release AiO Bot 2.14.26 Merchant Brain map update'
          git push origin HEAD:${GITHUB_REF_NAME}
