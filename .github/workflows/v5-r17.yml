name: v5-r17

on:
  pull_request:
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r17-*.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/P2-WORLD-AUTONOMY.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r17.yml'
  push:
    branches: [main]
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r17-*.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/P2-WORLD-AUTONOMY.md'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r17.yml'

permissions:
  contents: read

jobs:
  world-autonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Exakten Head verifizieren
        shell: bash
        run: |
          set -euo pipefail
          ERWARTET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$ERWARTET"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci
      - name: R17 World Autonomy pruefen
        working-directory: v5
        run: npm run r17:pruefen
