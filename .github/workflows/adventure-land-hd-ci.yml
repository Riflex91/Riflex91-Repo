name: Adventure Land HD CI
on:
  pull_request:
    paths:
      - "Adventure Land HD/**"
      - ".github/workflows/adventure-land-hd-ci.yml"
  push:
    branches: [main, "chatgpt/alhd-dev-v1"]
    paths:
      - "Adventure Land HD/**"
      - ".github/workflows/adventure-land-hd-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify inventory, bridge rules and runtime syntax
        working-directory: Adventure Land HD
        run: npm run check
      - name: Checkout pinned Adventure Land
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/kaansoral/adventureland_mongodb.git .upstream-adventureland
          git -C .upstream-adventureland fetch --depth=1 origin 90052162eb3ebda36c893e1eb4af643913c8f984
          git -C .upstream-adventureland checkout --detach 90052162eb3ebda36c893e1eb4af643913c8f984
      - name: Materialize deterministic generated HD assets
        working-directory: Adventure Land HD
        run: node tools/materialize-generated-hd-assets.mjs --upstream "../.upstream-adventureland"
      - name: Verify deterministic Mainland doors pilot hash
        shell: bash
        run: |
          echo "66fef5c19149ac4cf8a625b0c1b19a5ca6a359f35e1c0ec9d4350bf69de2235f  Adventure Land HD/hd-assets/map/doors@8x.png" | sha256sum --check --strict
      - name: Reject invalid explicit terrain scale
        working-directory: Adventure Land HD
        shell: bash
        run: |
          if node tools/build-nearest-png.mjs \
            --input "../.upstream-adventureland/images/tiles/map/doors.png" \
            --output "/tmp/invalid-scale.png" \
            --scale 0; then
            echo "explicit --scale 0 must fail" >&2
            exit 1
          fi
      - name: Upload Mainland doors 8x pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alhd-mainland-doors-8x
          path: Adventure Land HD/hd-assets/map/doors@8x.png
          if-no-files-found: error
          compression-level: 0
      - name: Deep-audit pinned visual assets
        working-directory: Adventure Land HD
        run: node tools/audit-assets.mjs --upstream "../.upstream-adventureland" --check-only
      - name: Verify complete Mainland visual scope
        working-directory: Adventure Land HD
        run: node tools/verify-main-map-scope.mjs --upstream "../.upstream-adventureland"
      - name: Verify complete Mainland NPC and monster entity plan
        working-directory: Adventure Land HD
        run: node tools/verify-mainland-entity-plan.mjs --upstream "../.upstream-adventureland"
      - name: Build safe Mainland entity candidate set
        working-directory: Adventure Land HD
        run: |
          mkdir -p /tmp/alhd-mainland-staged-assets
          node tools/build-mainland-entity-candidates.mjs \
            --upstream "../.upstream-adventureland" \
            --output-dir "/tmp/alhd-mainland-staged-assets" \
            --report "/tmp/alhd-mainland-entity-report.json"
      - name: Verify Mainland entity candidate report
        working-directory: Adventure Land HD
        run: node tools/verify-mainland-entity-candidate-report.mjs --report "/tmp/alhd-mainland-entity-report.json"
      - name: Upload Mainland entity candidate report
        uses: actions/upload-artifact@v4
        with:
          name: alhd-mainland-entity-report
          path: /tmp/alhd-mainland-entity-report.json
          if-no-files-found: error
          compression-level: 0
      - name: Build verified Mainland terrain promotion
        working-directory: Adventure Land HD
        run: node tools/build-mainland-terrain-promotion.mjs --report "/tmp/alhd-mainland-terrain-report.json" --output "/tmp/alhd-mainland-terrain-promotion.json"
      - name: Build verified Mainland entity promotion
        working-directory: Adventure Land HD
        run: node tools/build-mainland-entity-promotion.mjs --report "/tmp/alhd-mainland-entity-report.json" --output "/tmp/alhd-mainland-entity-promotion.json"
      - name: Build complete Mainland staged HD manifest
        working-directory: Adventure Land HD
        run: node tools/build-mainland-staged-manifest.mjs --terrain-promotion "/tmp/alhd-mainland-terrain-promotion.json" --entity-promotion "/tmp/alhd-mainland-entity-promotion.json" --output "/tmp/alhd-mainland-staged-manifest.json"
      - name: Validate complete Mainland staged HD manifest
        working-directory: Adventure Land HD
        run: node tools/validate-hd-assets.mjs --upstream "../.upstream-adventureland" --hd-root "/tmp/alhd-mainland-staged-assets" --manifest "/tmp/alhd-mainland-staged-manifest.json"
      - name: Upload complete Mainland staged evidence
        uses: actions/upload-artifact@v4
        with:
          name: alhd-mainland-staged-evidence
          path: |
            /tmp/alhd-mainland-terrain-promotion.json
            /tmp/alhd-mainland-entity-promotion.json
            /tmp/alhd-mainland-staged-manifest.json
          if-no-files-found: error
          compression-level: 0
      - name: Verify Mainland terrain production contract
        working-directory: Adventure Land HD
        run: node tools/verify-mainland-terrain-plan.mjs --upstream "../.upstream-adventureland"
      - name: Verify Mainland terrain runtime memory profile
        working-directory: Adventure Land HD
        run: node tools/verify-mainland-terrain-runtime-profile.mjs --upstream "../.upstream-adventureland"
      - name: Build safe Mainland terrain candidate set
        working-directory: Adventure Land HD
        run: |
          rm -rf /tmp/alhd-mainland-staged-assets
          mkdir -p /tmp/alhd-mainland-staged-assets
          node tools/build-mainland-terrain-candidates.mjs \
            --upstream "../.upstream-adventureland" \
            --output-dir "/tmp/alhd-mainland-staged-assets" \
            --report "/tmp/alhd-mainland-terrain-report.json"
      - name: Verify Mainland terrain candidate report
        working-directory: Adventure Land HD
        run: node tools/verify-mainland-terrain-candidate-report.mjs --report "/tmp/alhd-mainland-terrain-report.json"
      - name: Upload Mainland terrain candidate report
        uses: actions/upload-artifact@v4
        with:
          name: alhd-mainland-terrain-report
          path: /tmp/alhd-mainland-terrain-report.json
          if-no-files-found: error
          compression-level: 0
      - name: Audit renderer compatibility contracts
        working-directory: Adventure Land HD
        run: node tools/analyze-contracts.mjs --upstream "../.upstream-adventureland" --check-only
      - name: Materialize generated HD assets for validation
        working-directory: Adventure Land HD
        run: node tools/materialize-generated-hd-assets.mjs --upstream "../.upstream-adventureland"
      - name: Validate HD asset manifest
        working-directory: Adventure Land HD
        run: node tools/validate-hd-assets.mjs --upstream "../.upstream-adventureland" --hd-root "hd-assets"
      - name: Verify Phase 3 overlay target
        working-directory: Adventure Land HD
        run: node tools/prepare-runtime-overlay.mjs --upstream "../.upstream-adventureland" --check-only
      - name: Generate runtime manifest
        working-directory: Adventure Land HD
        run: node tools/build-runtime-manifest.mjs --output "/tmp/adventure-land-hd-manifest.js"
      - name: Verify no gameplay transport in HD bootstrap
        shell: bash
        run: |
          ! grep -E 'socket\.emit|api_call\(|smart_move\(|use_skill\(|attack\(' "Adventure Land HD/runtime/adventure-land-hd-bootstrap.js"
      - name: Materialize HD overlay into pinned original
        working-directory: Adventure Land HD
        run: node tools/prepare-runtime-overlay.mjs --upstream "../.upstream-adventureland"
      - name: Verify materialized overlay and pilot bytes
        working-directory: Adventure Land HD
        run: node tools/verify-runtime-overlay.mjs --upstream "../.upstream-adventureland"
