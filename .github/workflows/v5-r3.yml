name: v5-r3

on:
  pull_request:
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/tsconfig.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/architektur/host-api-allowlist.json'
      - 'v5/architektur/adr/**'
      - 'ops/windows-bridge/GitArbeitskopie.cs'
      - 'ops/windows-bridge/SsdVolumeGesundheitsPruefer.cs'
      - 'ops/windows-bridge-tests/Program.cs'
      - '.github/workflows/v5-r3.yml'
      - '.github/workflows/v5-wissenswaechter-pr.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/tsconfig.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/architektur/host-api-allowlist.json'
      - 'v5/architektur/adr/**'
      - 'ops/windows-bridge/GitArbeitskopie.cs'
      - 'ops/windows-bridge/SsdVolumeGesundheitsPruefer.cs'
      - 'ops/windows-bridge-tests/Program.cs'
      - '.github/workflows/v5-r3.yml'
      - '.github/workflows/v5-wissenswaechter-pr.yml'

permissions:
  contents: read

jobs:
  grundlage-und-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Exakten Head verifizieren
        shell: bash
        run: |
          set -euo pipefail
          ERWARTET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          IST="$(git rev-parse HEAD)"
          test "$IST" = "$ERWARTET"
          echo "V5_BUILD_GIT_SHA=$IST" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci

      - name: R3 vollstaendig pruefen
        working-directory: v5
        run: npm run r3:pruefen

      - name: ADR pruefen
        working-directory: v5
        run: node werkzeuge/r3-adr-pruefen.mjs

      - name: Build-Provenienz erzeugen
        working-directory: v5
        run: node werkzeuge/r3-build-provenienz.mjs > r3-build-provenienz.json

      - name: Provenienz hochladen
        uses: actions/upload-artifact@v4
        with:
          name: v5-r3-build-provenienz-${{ github.sha }}
          path: v5/r3-build-provenienz.json
          if-no-files-found: error
