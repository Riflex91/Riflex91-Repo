name: V5 Mandatory Test Plan Contract

on:
  pull_request:
    paths:
      - 'v5/roadmap/v5-verbindlicher-testplan.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/dokumentation/V5-VERBINDLICHER-TESTPLAN.md'
      - 'v5/werkzeuge/tests/v5-verbindlicher-testplan.test.mjs'
      - '.github/workflows/v5-mandatory-test-plan.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/roadmap/v5-verbindlicher-testplan.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/dokumentation/V5-VERBINDLICHER-TESTPLAN.md'
      - 'v5/werkzeuge/tests/v5-verbindlicher-testplan.test.mjs'
      - '.github/workflows/v5-mandatory-test-plan.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate mandatory V5 test plan
        run: node --test v5/werkzeuge/tests/v5-verbindlicher-testplan.test.mjs
