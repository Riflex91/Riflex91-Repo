name: release-21411
on:
  push:
    branches: [feature/2.14.11-brain-world-model]
permissions:
  contents: write
jobs:
  validate-and-commit:
    if: "!contains(github.event.head_commit.message, '[release-21411]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2.14.11-brain-world-model
          fetch-depth: 0
      - name: Apply 2.14.11 patch
        run: |
          python3 patch21411.py
          python3 patch21411_fix.py
      - name: Syntax check bot
        run: node --check bot.js
      - name: Syntax check worker
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Release verifier
        run: node scripts/verify-release.js
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do echo "== $f =="; node "$f"; done
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.js version.json cloudflare-dashboard scripts
          git rm -f patch21411.py patch21411_fix.py .github/workflows/release-21411.yml
          git commit -m "Release 2.14.11: Layered Bot Brain and game sprites [release-21411]"
          git push origin HEAD:feature/2.14.11-brain-world-model
