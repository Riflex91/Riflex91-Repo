name: release-21414
on:
  push:
    branches: ["perf/2.14.14-merchant-dashboard"]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[release-21414]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/2.14.14-merchant-dashboard
          fetch-depth: 0
      - name: Verify exact release base
        run: |
          set -euo pipefail
          BASE=fba17f49e0ce8883abb5c3e74fae0ecf07f261b8
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object bot.js)" = "41b6df5fc00c99a074f9dc399242f912531439d9"
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^(scripts/patch-21414\.py|\.github/workflows/release-21414\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes since exact main base:"
            echo "$unexpected"
            exit 1
          fi
      - name: Apply deterministic 2.14.14 patch
        run: python3 scripts/patch-21414.py
      - name: Syntax check bot and worker
        run: |
          node --check bot.js
          node --check cloudflare-dashboard/src/worker.js
      - name: Syntax check dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('cloudflare-dashboard/dashboard.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('dashboard script missing')
          Path('/tmp/dashboard.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Verify prepared release
        run: node scripts/verify-release.js
      - name: Run all smoke tests
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js scripts/smoke*.mjs; do
            [ -f "$f" ] || continue
            echo "==> $f"
            node "$f"
          done
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested release to performance branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js version.json cloudflare-dashboard scripts
          git rm -f scripts/patch-21414.py .github/workflows/release-21414.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Release 2.14.14: Merchant performance and terrain pipeline [release-21414]"
          git push origin HEAD:perf/2.14.14-merchant-dashboard
