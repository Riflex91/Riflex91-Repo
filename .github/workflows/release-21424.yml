name: release-21424
on:
  push:
    branches: ["release/2.14.24-group-buffs-bestiary-item-policy-map"]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2.14.24
        run: node scripts/apply-21424-group-buffs-bestiary-item-policy-map.mjs
      - name: Apply v2.14.24 config and buff hardening
        run: node scripts/apply-21424-config-buff-hardening.mjs
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('dashboard JS syntax OK');
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Normalize historical exact-version assertions
        shell: bash
        run: |
          sed -i -E "s/var VERSION = '2\.14\.(21|22|23)'/var VERSION = '2.14.24'/g" scripts/smoke*.js || true
          sed -i -E "s/AiO Bot Dashboard 2\.14\.(21|22|23)/AiO Bot Dashboard 2.14.24/g" scripts/smoke*.js || true
          sed -i -E "s/\\\"version\\\": \\\"2\.14\.(21|22|23)\\\"/\\\"version\\\": \\\"2.14.24\\\"/g" scripts/smoke*.js || true
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const f of fs.readdirSync('scripts').filter(x=>/^smoke.*\.js$/.test(x))){
            const p=path.join('scripts',f);let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\.includes\("'"\+([A-Za-z_$][\w$]*)\+"'"\)/g,'.includes($1)');
            s=s.replace(/version\.version\s*,\s*'2\.14\.(?:21|22|23)'/g,"version.version,'2.14.24'");
            s=s.replace(/version\.dashboardVersion\s*,\s*'2\.14\.(?:21|22|23)'/g,"version.dashboardVersion,'2.14.24'");
            s=s.replace(/(assert\.(?:equal|strictEqual)\([^,\n]+,\s*)'2\.14\.(?:21|22|23)'/g,"$1'2.14.24'");
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Run complete smoke suite
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do node "$f"; done
          shopt -s nullglob
          for f in scripts/smoke*.mjs; do node "$f"; done
      - name: Restore historical smoke sources before diff
        run: git checkout -- scripts/smoke*.js || true
      - name: Diff check
        run: git diff --check
      - name: Commit verified release tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js version.json cloudflare-dashboard/package.json cloudflare-dashboard/dashboard.html cloudflare-dashboard/src/worker.js scripts/verify-release.js
          git commit -m 'Release AiO Bot 2.14.24 group buffs bestiary item policy map'
          git push origin HEAD:${GITHUB_REF_NAME}
