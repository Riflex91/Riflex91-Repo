name: release-21421
on:
  push:
    branches: ["release/2.14.21-mobile-reliability"]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[21421-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 2.14.21 patch
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const read=p=>fs.readFileSync(p,'utf8'), write=(p,s)=>fs.writeFileSync(p,s);
          let bot=read('bot.js');
          if(!bot.includes("var VERSION = '2.14.20';")) throw new Error('expected 2.14.20 base');
          bot=bot.replace('AiO Bot 2.14.20 | 2026-09-11','AiO Bot 2.14.21 | 2026-09-11');
          bot=bot.replace("var VERSION = '2.14.20';","var VERSION = '2.14.21';");

          // Consolidate every dynamically-added protected marker into the original static contract.
          const contractMatch=bot.match(/var FEATURE_CONTRACT\s*=\s*(\[[\s\S]*?\]);/);
          if(!contractMatch) throw new Error('FEATURE_CONTRACT literal missing');
          const base=Function('return '+contractMatch[1])();
          const all=new Set(base);
          const addRe=/\[([^\]]*?'[^\]]*?)\]\.forEach\(function\(f\)\{if\(FEATURE_CONTRACT\.indexOf\(f\)<0\)FEATURE_CONTRACT\.push\(f\);\}\);/g;
          for(const m of bot.matchAll(addRe)){
            const vals=Function('return ['+m[1]+']')();
            vals.forEach(v=>all.add(v));
          }
          ['update-contract-static-manifest','update-failure-backoff','teacher-quota-persistence','release-identity-telemetry','cloudflare-auto-deploy-ready'].forEach(v=>all.add(v));
          const arr=[...all];
          const lines=[]; for(let i=0;i<arr.length;i+=6) lines.push('    '+arr.slice(i,i+6).map(v=>JSON.stringify(v)).join(','));
          bot=bot.replace(contractMatch[0],"var FEATURE_CONTRACT = [\n"+lines.join(',\n')+"\n  ];");

          // Back off identical failed update candidates instead of retrying every few seconds/minute.
          const oldCatch="}).catch(function(e){S.update.applying=false;S.update.error=reason(e);audit('update_auto_error','Automatisches Update fehlgeschlagen; Retry folgt ohne Benutzereingriff: '+reason(e),{latest:S.update.latest,attempt:attempt,nextRetryMs:Math.min(45000,10000*Math.max(1,attempt))},'error');P.setTimeout(function(){S.update.checkedAt=0;if(S.update.available||newer(S.update.latest||'',VERSION))selfUpdate(true);else updateCheckTick(true);},Math.min(45000,10000*Math.max(1,attempt)));if(attempt>=6)S.update.applyAttempt=0;renderAll(true);return false;});";
          const newCatch="}).catch(function(e){S.update.applying=false;S.update.error=reason(e);var now=clock(),fp=String(S.update.latest||'')+'|'+S.update.error,b=S.updateFailure21421||(S.updateFailure21421={fingerprint:'',count:0,until:0});if(b.fingerprint!==fp){b.fingerprint=fp;b.count=0;}b.count=Math.min(4,Number(b.count||0)+1);var waits=[300000,900000,3600000,21600000],wait=waits[b.count-1];b.until=now+wait;write('updateFailure21421',b);if(now>Number(S.times.updateFailureLog21421||0)){S.times.updateFailureLog21421=now+Math.min(wait,900000);audit('update_auto_error','Automatisches Update fehlgeschlagen; identischer Kandidat wird kontrolliert erneut geprüft: '+S.update.error,{latest:S.update.latest,attempt:attempt,fingerprint:fp,retryAt:b.until,nextRetryMs:wait},'error');}P.setTimeout(function(){var cur=S.updateFailure21421;if(!cur||cur.fingerprint!==fp||clock()<Number(cur.until||0))return;S.update.checkedAt=0;updateCheckTick(true);},wait+1000);renderAll(true);return false;});";
          if(!bot.includes(oldCatch)) throw new Error('latest selfUpdate catch pattern missing');
          bot=bot.replace(oldCatch,newCatch);

          const oldCheck="checkRepo(repo).then(function(r){S.update.checking=false;S.update.latest=r.version;S.update.repo=r.repo;S.update.raw=r.raw;S.update.available=newer(r.version,VERSION);S.update.error='';audit('update_check',S.update.available?'Neue Bot-Version erkannt: '+r.version:'Bot is current',Object.assign({},r,{activeSlot:activeCodeSlot(),automatic:true}),S.update.available?'warning':'info');renderAll(true);if(S.update.available){v277BroadcastUpdate(r.version);P.setTimeout(function(){selfUpdate(true);},150+Math.floor(Math.random()*650));}})";
          const newCheck="checkRepo(repo).then(function(r){S.update.checking=false;S.update.latest=r.version;S.update.repo=r.repo;S.update.raw=r.raw;S.update.available=newer(r.version,VERSION);S.update.error='';var b=S.updateFailure21421||read('updateFailure21421',null),blocked=!!(S.update.available&&b&&String(b.fingerprint||'').indexOf(String(r.version)+'|')===0&&clock()<Number(b.until||0));if(blocked){S.updateFailure21421=b;if(clock()>Number(S.times.updateBackoffNotice21421||0)){S.times.updateBackoffNotice21421=clock()+300000;audit('update_backoff_active','Bekannter inkompatibler Update-Kandidat bleibt bis zum Backoff-Ende pausiert',{latest:r.version,retryAt:Number(b.until)||0,count:Number(b.count)||0},'warning');}}else{if(!S.update.available&&S.updateFailure21421){S.updateFailure21421=null;write('updateFailure21421',null);}audit('update_check',S.update.available?'Neue Bot-Version erkannt: '+r.version:'Bot is current',Object.assign({},r,{activeSlot:activeCodeSlot(),automatic:true}),S.update.available?'warning':'info');}renderAll(true);if(S.update.available&&!blocked){v277BroadcastUpdate(r.version);P.setTimeout(function(){selfUpdate(true);},150+Math.floor(Math.random()*650));}})";
          if(!bot.includes(oldCheck)) throw new Error('latest updateCheck pattern missing');
          bot=bot.replace(oldCheck,newCheck);

          const block=`\n\n  // ---------------------------------------------------------------------------\n  // 2.14.21 Mobile-first update reliability + persisted Teacher quota + release identity\n  // ---------------------------------------------------------------------------\n  var V21421_TEACHER_QUOTA_KEY='teacherQuotaUntil21421:'+me;\n  var v21421AuditBase=audit;\n  audit=function(kind,message,data,level){if(kind==='brain_error'&&v21420TeacherClass(data&&(data.errorClass||data.error)||message)==='quota_exhausted'){var until=clock()+Math.max(3600000,v210ResetMs());write(V21421_TEACHER_QUOTA_KEY,until);S.teacherQuotaUntil21421=until;}return v21421AuditBase(kind,message,data,level);};\n  var v21421TeacherBase=v290BrainTick;\n  v290BrainTick=function(trigger,force){var until=Math.max(Number(S.teacherQuotaUntil21421)||0,Number(read(V21421_TEACHER_QUOTA_KEY,0))||0);if(clock()<until){S.teacherQuotaUntil21421=until;S.teacherSuppressedReason21419='quota-exhausted';v21420LocalStudentTick();return false;}if(until){S.teacherQuotaUntil21421=0;write(V21421_TEACHER_QUOTA_KEY,0);}return v21421TeacherBase(trigger,force);};\n  var v21421DashboardBase=dashboardPayload;\n  dashboardPayload=function(){var d=v21421DashboardBase();d.botRelease={version:VERSION,build:BUILD,protocol:REPORT_PROTOCOL};return d;};\n  var v21421ResearchBase=v214ResearchData;\n  v214ResearchData=function(profile,hours,anonymize){var d=v21421ResearchBase(profile,hours,anonymize);d.botRelease={version:VERSION,build:BUILD,protocol:REPORT_PROTOCOL};return d;};\n  audit('feature_contract','2.14.21 Mobile Update Backoff + statischer Feature-Contract + persistente Teacher-Quota + Release-Identität geprüft',{features:FEATURE_CONTRACT});\n`;
          if(bot.includes('// 2.14.21 Mobile-first update reliability')) throw new Error('2.14.21 already present');
          bot=bot.replace(/\n\}\)\(\);\s*$/,block+'\n})();');
          write('bot.js',bot);

          const version=JSON.parse(read('version.json'));version.version='2.14.21';version.dashboardVersion='2.14.21';version.build='2026-09-11';write('version.json',JSON.stringify(version,null,2)+'\n');
          const pkg=JSON.parse(read('cloudflare-dashboard/package.json'));pkg.version='2.14.21';write('cloudflare-dashboard/package.json',JSON.stringify(pkg,null,2)+'\n');
          for(const p of ['cloudflare-dashboard/src/worker.js','cloudflare-dashboard/dashboard.html','scripts/verify-release.js']){let s=read(p);s=s.replaceAll('2.14.20','2.14.21');write(p,s);}
          for(const n of fs.readdirSync('scripts').filter(n=>/^smoke.*\.(js|mjs)$/.test(n))){const p=path.join('scripts',n);let s=read(p);s=s.replaceAll('2.14.20','2.14.21');write(p,s);}

          // D1 research brief: expose the running client release identity when supplied by dashboard payload.
          let worker=read('cloudflare-dashboard/src/worker.js');
          const charNeedle="farmHealth:p.farmHealth&&typeof p.farmHealth===\"object\"?{visible:number(p.farmHealth.visible),competitors:number(p.farmHealth.competitors),xpPerHour:number(p.farmHealth.xpPerHour),expectedXpPerHour:number(p.farmHealth.expectedXpPerHour),goldPerHour:number(p.farmHealth.goldPerHour),safetyPct:number(p.farmHealth.safetyPct),goal:p.farmHealth.goal||null}:null";
          const charReplace=charNeedle+",botRelease:p.botRelease&&typeof p.botRelease===\"object\"?{version:text(p.botRelease.version,24),build:text(p.botRelease.build,32),protocol:number(p.botRelease.protocol)}:null";
          if(!worker.includes(charNeedle)) throw new Error('worker character research mapping pattern missing');
          worker=worker.replace(charNeedle,charReplace);write('cloudflare-dashboard/src/worker.js',worker);

          const smoke=`const fs=require('fs');\nconst bot=fs.readFileSync('bot.js','utf8');\nconst worker=fs.readFileSync('cloudflare-dashboard/src/worker.js','utf8');\nconst v=JSON.parse(fs.readFileSync('version.json','utf8'));\nfunction ok(x,m){if(!x)throw new Error(m);}\nok(v.version==='2.14.21'&&v.dashboardVersion==='2.14.21','version sync');\nok(/var VERSION = '2\\.14\\.21'/.test(bot),'bot version');\n['merchant-route-owner','teacher-quota-circuit-breaker','research-window-integrity','update-contract-static-manifest','update-failure-backoff','teacher-quota-persistence','release-identity-telemetry','cloudflare-auto-deploy-ready'].forEach(x=>ok(bot.match(/var FEATURE_CONTRACT\\s*=\\s*(\\[[\\s\\S]*?\\]);/)[1].includes(x),'static contract '+x));\nok(bot.includes('update_backoff_active')&&bot.includes('updateFailure21421'),'update failure backoff');\nok(bot.includes('teacherQuotaUntil21421')&&bot.includes('v21420LocalStudentTick'),'persisted quota + local student');\nok(bot.includes('d.botRelease={version:VERSION,build:BUILD,protocol:REPORT_PROTOCOL}'),'release identity payload');\nok(worker.includes('botRelease:p.botRelease'),'D1 release identity mapping');\nok(bot.includes('brainStudentLearningRate: 0.012')&&bot.includes('brainStudentConfidencePct: 82')&&bot.includes('brainChallengerTrafficPct: 20'),'brain tuning unchanged');\nconsole.log('2.14.21 mobile reliability smoke OK');\n`;
          write('scripts/smoke-21421-mobile-reliability.js',smoke);
          NODE
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Smoke JS
        shell: bash
        run: 'set -euo pipefail; for f in scripts/smoke*.js; do node "$f"; done'
      - name: Smoke MJS
        shell: bash
        run: 'set -euo pipefail; shopt -s nullglob; for f in scripts/smoke*.mjs; do node "$f"; done'
      - name: Diff check
        run: git diff --check
      - name: Commit tested release
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.js version.json cloudflare-dashboard scripts
          git commit -m "Release 2.14.21 mobile reliability [21421-applied]"
          git push
  validate-final-tree:
    if: ${{ contains(github.event.head_commit.message, '[21421-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check bot.js
      - run: node --check cloudflare-dashboard/src/worker.js
      - run: node scripts/verify-release.js
      - shell: bash
        run: 'set -euo pipefail; for f in scripts/smoke*.js; do node "$f"; done; shopt -s nullglob; for f in scripts/smoke*.mjs; do node "$f"; done'
