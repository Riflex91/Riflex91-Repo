name: release-21421
on:
  push:
    branches: ["release/2.14.21-mobile-reliability-v2"]
permissions:
  contents: read
jobs:
  validate-final-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bot syntax
        run: node --check bot.js
      - name: Worker syntax
        run: node --check cloudflare-dashboard/src/worker.js
      - name: Dashboard JS syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('dashboard JS syntax OK');
          NODE
      - name: Verify release
        run: node scripts/verify-release.js
      - name: Smoke JS and MJS
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do node "$f"; done
          shopt -s nullglob
          for f in scripts/smoke*.mjs; do node "$f"; done
      - name: Release diff check
        run: git diff --check origin/main...HEAD
      - name: Cloudflare workflow sanity
        shell: bash
        run: |
          grep -q 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-cloudflare.yml
          grep -q 'wrangler d1 list --json' .github/workflows/deploy-cloudflare.yml
          grep -q 'wrangler deploy --config wrangler.deploy.jsonc' .github/workflows/deploy-cloudflare.yml
