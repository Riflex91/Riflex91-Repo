name: v5-pr21-28-foundations

on:
  push:
    paths:
      - 'v5/grundlage/quelle/merchant/pr21-merchant-integration-readiness.ts'
      - 'v5/grundlage/quelle/koordination/pr22-coordination-shadow-admission.ts'
      - 'v5/grundlage/quelle/koordination/production-material-acquisition.ts'
      - 'v5/grundlage/tests/pr22-23-production-material-acquisition.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr22-23-production-material-acquisition-foundation.json'
      - 'v5/grundlage/quelle/farmer/pr23-farmer-shadow-admission.ts'
      - 'v5/grundlage/quelle/gruppe/pr24-group-constellation-matrix.ts'
      - 'v5/grundlage/quelle/gruppe/pr25-group-live-evidence-plan.ts'
      - 'v5/grundlage/quelle/optimierung/pr26-task-party-optimizer.ts'
      - 'v5/grundlage/quelle/optimierung/pr27-account-progression-balancer.ts'
      - 'v5/grundlage/quelle/welt/pr28-world-autonomy-gate.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-accelerated-foundations.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-accelerated-foundations.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/package.json'
      - '.github/workflows/v5-pr21-28-foundations.yml'
  pull_request:
    paths:
      - 'v5/grundlage/quelle/merchant/pr21-merchant-integration-readiness.ts'
      - 'v5/grundlage/quelle/koordination/pr22-coordination-shadow-admission.ts'
      - 'v5/grundlage/quelle/koordination/production-material-acquisition.ts'
      - 'v5/grundlage/tests/pr22-23-production-material-acquisition.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr22-23-production-material-acquisition-foundation.json'
      - 'v5/grundlage/quelle/farmer/pr23-farmer-shadow-admission.ts'
      - 'v5/grundlage/quelle/gruppe/pr24-group-constellation-matrix.ts'
      - 'v5/grundlage/quelle/gruppe/pr25-group-live-evidence-plan.ts'
      - 'v5/grundlage/quelle/optimierung/pr26-task-party-optimizer.ts'
      - 'v5/grundlage/quelle/optimierung/pr27-account-progression-balancer.ts'
      - 'v5/grundlage/quelle/welt/pr28-world-autonomy-gate.ts'
      - 'v5/grundlage/quelle/index.ts'
      - 'v5/grundlage/tests/pr21-28-accelerated-foundations.test.mjs'
      - 'v5/grundlage/vertraege/runtime/pr21-28-accelerated-foundations.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/package.json'
      - '.github/workflows/v5-pr21-28-foundations.yml'

permissions:
  contents: read

jobs:
  accelerated-foundations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - run: npm ci
      - run: npm run post-pr20-foundations:pruefen
