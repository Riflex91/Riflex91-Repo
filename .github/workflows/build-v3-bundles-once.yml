name: build-v3-bundles-once
on:
  push:
    branches:
      - fix/p0-regroup-bundle-supply-5000

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'run-v3-bundle-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-regroup-bundle-supply-5000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v3 guard dependencies
        working-directory: v3
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build browser bundles
        working-directory: v3
        run: npm run build
      - name: Commit generated bundles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/dist/aio-v3.js v3/dist/aio-v3-runtime.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Bundles already current.'
            exit 0
          fi
          git commit -m 'build(v3): refresh generated bundles for alpha.20.53'
          git push origin HEAD:fix/p0-regroup-bundle-supply-5000
