name: v5-wissenswaechter-pr

on:
  push:
    branches:
      - v5/wissenswaechter-automatisch
    paths:
      - 'v5/wissensbasis/**'
      - '.github/workflows/v5-wissenswaechter-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pruefen-und-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Knowledge-Branch-Pfadgrenze pruefen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          UNERLAUBT="$(git diff --name-only origin/main...HEAD | grep -Ev '^v5/wissensbasis/' || true)"
          if [[ -n "$UNERLAUBT" ]]; then
            echo "Knowledge-Branch enthaelt Pfade ausserhalb v5/wissensbasis/**:" >&2
            echo "$UNERLAUBT" >&2
            exit 1
          fi

      - name: V5 Wissensbasis pruefen
        run: node v5/werkzeuge/wissensbasis-pruefen.mjs

      - name: Entwicklungs-Wissensgate pruefen
        run: node v5/werkzeuge/entwicklungs-wissensgate.mjs

      - name: Pull Request anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: v5/wissenswaechter-automatisch
        shell: bash
        run: |
          set -euo pipefail
          NUMMER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$NUMMER" ]]; then
            gh pr edit "$NUMMER"               --title "V5 Wissen: automatischer geprüfter Snapshot"               --body "Automatisch erzeugter Knowledge-PR. Änderungen sind auf v5/wissensbasis/** begrenzt und wurden vor PR-Erstellung validiert."
          else
            gh pr create               --base main               --head "$BRANCH"               --title "V5 Wissen: automatischer geprüfter Snapshot"               --body "Automatisch erzeugter Knowledge-PR. Änderungen sind auf v5/wissensbasis/** begrenzt und wurden vor PR-Erstellung validiert."
          fi
