name: Smartphone Clientless

on:
  pull_request:
    paths:
      - 'smartphone-clientless/**'
      - '.github/workflows/smartphone-clientless.yml'
  push:
    branches: [main]
    paths:
      - 'smartphone-clientless/**'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smartphone-clientless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartphone-clientless/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
