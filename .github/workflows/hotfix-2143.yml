name: One-shot 2.14.3 Scroll Bank Loop Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2143.yml"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 2.14.3 scroll/bank loop fix
        run: python scripts/apply-2.14.3-scroll-bank-fix.py
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Merchant stability smoke
        run: node scripts/smoke-merchant-stability.js
      - name: Student smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality smoke
        run: node scripts/smoke-quality.js
      - name: Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Cloudflare Worker smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.3 if tests passed
        run: |
          git config user.name "Riflex91"
          git config user.email "hansijuergenlul@gmail.com"
          git add bot.js version.json README.md BOT_README.md scripts/verify-release.js scripts/smoke-merchant-stability.js
          git commit -m "Release 2.14.3: prevent scroll bank loop"
          git push origin main
