name: Mewthisch Guides 1.0 rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - "world of warcraft/MewthischGuides1/**"
      - ".github/workflows/mewthisch-guides-1.0.yml"
  pull_request:
    paths:
      - "world of warcraft/MewthischGuides1/**"
      - ".github/workflows/mewthisch-guides-1.0.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find "world of warcraft/MewthischGuides1" -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate RestedXP parser and compiled domain
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local root="world of warcraft/MewthischGuides1/"
          local MG={}
          assert(loadfile(root.."Core/Namespace.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Runtime/RuntimeStore.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Core/ErrorLog.lua"))("MewthischGuides1",MG)
          MG:EnsureDB()

          for i=1,5 do
            assert(loadfile(root..string.format("Data/RestedXPForeverData_%02d.lua",i)))(
              "MewthischGuides1",MG)
          end
          assert(loadfile(root.."Data/RestedXPActionCatalog.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Guide/RestedXPSelector.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Guide/RestedXPParser.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Guide/GuideCompiler.lua"))("MewthischGuides1",MG)

          local raw=MG.RestedXPParser:Parse()
          local rawStats=MG.RestedXPParser:GetStats()
          local compiled=MG.GuideCompiler:CompileAll()
          local compiledStats=MG.GuideCompiler:GetStats()

          assert(#raw > 50,"expected substantial RestedXP guide corpus")
          assert(rawStats.steps > 5000,"expected substantial RestedXP step corpus")
          assert(rawStats.actions > 20000,"expected substantial RestedXP action corpus")
          assert(rawStats.sourceCommit=="6f9cf44c09123e496366b3cb5ffe7383660e4bcb",
            "unexpected RestedXP source commit")
          assert(#compiled==#raw,"every named raw guide must compile")
          assert(compiledStats.steps==rawStats.steps,
            "compiler must preserve RestedXP raw-step boundaries 1:1")
          assert(compiledStats.stickySteps>0,"sticky steps must be preserved")
          assert(compiledStats.engineLevelCap==nil,"engine must not have a hard level cap")

          local unknown={}
          for _,guide in ipairs(raw) do
            for _,step in ipairs(guide.steps or {}) do
              for _,action in ipairs(step.actions or {}) do
                if not MG.RestEDXPActionCatalog:IsKnown(action.kind) then
                  unknown[action.kind]=(unknown[action.kind] or 0)+1
                end
              end
            end
          end
          for kind,count in pairs(unknown) do
            error("unknown RestedXP action kind "..tostring(kind).." x"..tostring(count))
          end

          local synthetic={
            sourceFile="synthetic.lua",
            metadata={name="21-60 Future Route",selector="Horde"},
            steps={{selector="",tags={},actions={{kind="accept",args="123",rawLine=1}},raw={line=1}}},
          }
          local future=assert(MG.GuideCompiler:CompileGuide(synthetic,999))
          assert(future.minLevel==21 and future.maxLevel==60)
          print("RestedXP parser + compiled domain PASS")
          LUA

      - name: Validate selector semantics
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local root="world of warcraft/MewthischGuides1/"
          local MG={}
          assert(loadfile(root.."Core/Namespace.lua"))("MewthischGuides1",MG)
          MG:EnsureDB()
          assert(loadfile(root.."Guide/RestedXPSelector.lua"))("MewthischGuides1",MG)

          local p={faction="Horde",race="Troll",class="MAGE",level=12}
          assert(MG.RestedXPSelector:Matches("Horde",p))
          assert(MG.RestedXPSelector:Matches("Troll Mage",p))
          assert(MG.RestedXPSelector:Matches("Warrior/Mage",p))
          assert(not MG.RestedXPSelector:Matches("Alliance",p))
          assert(not MG.RestedXPSelector:Matches("!Troll",p))
          local ok,reason=MG.RestedXPSelector:Matches("UnknownPredicate",p)
          assert(not ok and reason:find("unknown_selector_atom",1,true))
          print("RestedXP selector semantics PASS")
          LUA

      - name: Validate multi-goal runtime semantics
        shell: bash
        run: |
          lua5.1 - <<'LUA'
          local root="world of warcraft/MewthischGuides1/"
          local MG={}
          assert(loadfile(root.."Core/Namespace.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Runtime/RuntimeStore.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Core/ErrorLog.lua"))("MewthischGuides1",MG)
          MG:EnsureDB()
          assert(loadfile(root.."Guide/RestedXPSelector.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/RequirementResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/VisibilityResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/CompletionResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/GoalStateResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/StepStateResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Resolver/NavigationTargetResolver.lua"))("MewthischGuides1",MG)
          assert(loadfile(root.."Runtime/TransitionDetector.lua"))("MewthischGuides1",MG)

          local req={stepSelector="",actionSelector="",tags={}}
          local step={id="s1",goals={
            {id="g1",action="complete",role="goal",completionKind="quest_objective",
              questID=10,objectiveIndex=1,requirements=req,waypoint={mapID=1,x=.4,y=.4}},
            {id="g2",action="collect",role="goal",completionKind="collect",
              itemID=20,required=3,requirements=req,waypoint={mapID=1,x=.5,y=.5}},
            {id="g3",action="goto",role="navigation",completionKind="position",
              passive=true,requirements=req,waypoint={mapID=1,x=.4,y=.4}},
          }}
          local facts={player={faction="Horde",race="Troll",class="MAGE",level=12},
            quests={[10]={active=true,objectives={{finished=false,current=2,required=5,text="2/5"}}}},
            inventory={[20]=1},position={mapID=1,x=.1,y=.1}}

          local states={}
          for _,goal in ipairs(step.goals) do
            states[#states+1]=MG.GoalStateResolver:Resolve(goal,facts)
          end
          local ss=MG.StepStateResolver:Resolve(step,states)
          assert(#states==3)
          assert(ss.blockingGoals==2,"passive navigation must not block")
          assert(not ss.complete)
          local nav=assert(MG.NavigationTargetResolver:Resolve(states,{}))
          assert(nav.goalState.id=="g1","first semantic goal should be navigation target")

          local initial={stepID="s1",goalStates=states,stickies={},stepState=ss}
          assert(#MG.TransitionDetector:Detect(nil,initial)==0,
            "initial state must not emit transitions")

          facts.quests[10].objectives[1].finished=true
          facts.quests[10].objectives[1].current=5
          local states2={}
          for _,goal in ipairs(step.goals) do states2[#states2+1]=MG.GoalStateResolver:Resolve(goal,facts) end
          local ss2=MG.StepStateResolver:Resolve(step,states2)
          local current={stepID="s1",goalStates=states2,stickies={},stepState=ss2}
          local events=MG.TransitionDetector:Detect(initial,current)
          local saw=false
          for _,event in ipairs(events) do
            if event.type=="GOAL_COMPLETED" and event.goalID=="g1" then saw=true end
          end
          assert(saw,"later incomplete->complete must emit GOAL_COMPLETED")
          assert(MG.NavigationTargetResolver:Resolve(states2,{}).goalState.id=="g2",
            "navigation must move without deactivating the other goal")
          print("Multi-goal runtime semantics PASS")
          LUA

      - name: Validate TOC architecture contract
        shell: bash
        run: |
          set -euo pipefail
          TOC="world of warcraft/MewthischGuides1/MewthischGuides1.toc"
          grep -q 'Guide/RestedXPParser.lua' "$TOC"
          grep -q 'Guide/GuideCompiler.lua' "$TOC"
          grep -q 'Runtime/RuntimeStore.lua' "$TOC"
          grep -q 'Resolver/GoalStateResolver.lua' "$TOC"
          grep -q 'Runtime/TransitionDetector.lua' "$TOC"
          grep -q 'UI/ErrorLogWindow.lua' "$TOC"
          grep -q 'Core/Bootstrap.lua' "$TOC"
          echo "TOC architecture contract PASS"
