name: release-21418

'on':
  push:
    branches:
      - hotfix/2.14.18-merchant-stability-performance

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact 2.14.17 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d6714c495376997b7d13f1ac3adbf46b4d532aa"
          test "$(git merge-base HEAD origin/main)" = "6d6714c495376997b7d13f1ac3adbf46b4d532aa"
          git diff --quiet origin/main -- bot.js version.json cloudflare-dashboard scripts/verify-release.js
          git diff --quiet origin/main -- 'scripts/smoke*.js' 'scripts/smoke*.mjs'

      - name: Apply 2.14.18 patch
        run: python3 scripts/prepare-21418.py

      - name: Normalize retained current-release pins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('scripts').glob('smoke*.js'):
              t=p.read_text()
              t=t.replace("assert.equal(version.version,'2.14.17');","assert.ok(/^2\\.14\\.\\d+$/.test(version.version));")
              t=t.replace("assert.equal(version.dashboardVersion,'2.14.17');","assert.equal(version.dashboardVersion,version.version);")
              lines=[]
              for line in t.splitlines(True):
                  if 'assert' in line and '2.14.17' in line:
                      if 'var VERSION' in line or 'AiO Bot Dashboard' in line:
                          line=line.replace('2.14.17','2.14.18')
                  if 'assert.match(bot,/var VERSION' in line:
                      line=line.replace(r'2\.14\.18',r'2\.14\.\d+')
                  lines.append(line)
              p.write_text(''.join(lines))
          PY

      - name: Syntax check bot and worker
        run: |
          node --check bot.js
          node --check cloudflare-dashboard/src/worker.js

      - name: Syntax check dashboard JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('cloudflare-dashboard/dashboard.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]);
          if(!scripts.length) throw new Error('dashboard scripts missing');
          scripts.forEach((s,i)=>new vm.Script(s,{filename:'dashboard-inline-'+i+'.js'}));
          NODE

      - name: Verify release
        run: node scripts/verify-release.js

      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js scripts/smoke*.mjs; do
            [ -e "$f" ] || continue
            echo "== $f =="
            node "$f"
          done

      - name: Whitespace check
        run: git diff --check

      - name: Recheck main before tested release write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d6714c495376997b7d13f1ac3adbf46b4d532aa"

      - name: Commit tested release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 2.14.18: Merchant stability and phase profiling [tested-21418]"
          git push origin HEAD:hotfix/2.14.18-merchant-stability-performance
