name: One-shot 2.14.5 Merchant Reliability Dashboard UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2145.yml"
      - "scripts/apply-2.14.5-merchant-path-dashboard-ui.py"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 2.14.5 Merchant reliability dashboard UI fix
        run: python scripts/apply-2.14.5-merchant-path-dashboard-ui.py
      - name: Keep 2.14.4 regression compatible with current release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-2144-merchant-party-ui.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('2\\.14\\.4','2\\.14\\.5').replace('2.14.4','2.14.5')
          p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Merchant stability smoke
        run: node scripts/smoke-merchant-stability.js
      - name: 2.14.4 retained regression smoke
        run: node scripts/smoke-2144-merchant-party-ui.js
      - name: 2.14.5 Merchant path dashboard UI smoke
        run: node scripts/smoke-2145-merchant-path-dashboard-ui.js
      - name: Student smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality smoke
        run: node scripts/smoke-quality.js
      - name: Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Cloudflare Worker smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.5 if tests passed
        run: |
          git config user.name "Riflex91"
          git config user.email "hansijuergenlul@gmail.com"
          git add bot.js version.json README.md BOT_README.md cloudflare-dashboard/dashboard.html cloudflare-dashboard/src/worker.js cloudflare-dashboard/package.json scripts/verify-release.js scripts/smoke-merchant-stability.js scripts/smoke-2144-merchant-party-ui.js scripts/smoke-2145-merchant-path-dashboard-ui.js
          git commit -m "Release 2.14.5: Merchant reliability and dashboard UI"
          git push origin main
