name: v5-r6

on:
  pull_request:
    paths:
      - 'v5/grundlage/**'
      - 'v5/anzeigetexte/**'
      - 'v5/wissensbasis/datenbank/aktuell/AL-DATA-*.txt'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r6-*.mjs'
      - 'v5/architektur/adr/**'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r6.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/grundlage/**'
      - 'v5/anzeigetexte/**'
      - 'v5/wissensbasis/datenbank/aktuell/AL-DATA-*.txt'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r6-*.mjs'
      - 'v5/architektur/adr/**'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/fitness/**'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r6.yml'

permissions:
  contents: read

jobs:
  wissen-und-weltwahrheit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Exakten Head verifizieren
        shell: bash
        run: |
          set -euo pipefail
          ERWARTET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          IST="$(git rev-parse HEAD)"
          test "$IST" = "$ERWARTET"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci

      - name: R6 Wissenszugriff und World Truth pruefen
        working-directory: v5
        run: npm run r6:pruefen

      - name: R6 Wissensnachweis erzeugen
        working-directory: v5
        run: node werkzeuge/r6-wissens-nachweis.mjs

      - name: R6 Nachweise hochladen
        uses: actions/upload-artifact@v4
        with:
          name: v5-r6-nachweis-${{ github.sha }}
          path: |
            v5/r6-wissensnachweis.json
            v5/r6-anzeigekatalog-abdeckung.json
          if-no-files-found: error
