name: release-v3-alpha
on:
  push:
    branches: ["v3/**"]
    paths: ["v3/**", ".github/workflows/release-v3.yml"]
  pull_request:
    branches: ["main"]
    paths: ["v3/**", ".github/workflows/release-v3.yml"]
permissions:
  contents: write
jobs:
  v3-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release guardian preflight
        working-directory: v3
        run: npm run preflight
      - name: Build and test v3
        working-directory: v3
        run: npm run check:full
      - name: Commit generated browser bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1 && git diff --quiet -- v3/dist/aio-v3.js; then
            echo 'Bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/dist/aio-v3.js
          git commit -m 'Build AiO Bot v3 browser bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify generated bundle on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1
          git diff --exit-code -- v3/dist/aio-v3.js
      - name: Diff check
        run: git diff --check
