name: release-v3-alpha
on:
  push:
    branches: ["v3/**"]
    paths:
      - "v3/**"
      - ".github/workflows/release-v3.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "v3/**"
      - ".github/workflows/release-v3.yml"
permissions:
  contents: write
jobs:
  v3-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v3 guard dependencies
        working-directory: v3
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Prepare bootstrap migration release 20.47
        id: release
        if: github.event_name == 'push'
        working-directory: v3
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./version.json').version")"
          if [ "$current" = "3.0.0-alpha.20.46" ]; then
            npm run release:patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release already at $current; bootstrap migration bump skipped."
          fi
      - name: Commit bootstrap migration release 20.47
        if: github.event_name == 'push' && steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/version.json v3/package.json v3/src/release-version.js v3/test v3/dist/aio-v3.js v3/dist/aio-v3-runtime.js
          git diff --cached --check
          git commit -m 'Release v3 bootstrap updater as 3.0.0-alpha.20.47'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Build bootstrap and remote runtime bundles
        working-directory: v3
        run: npm run build
      - name: Release + Logic Guardian preflight
        working-directory: v3
        run: npm run preflight
      - name: Run v3 unit tests
        working-directory: v3
        run: npm test
      - name: Verify bootstrap and runtime bundle syntax and smoke tests
        working-directory: v3
        run: node --check dist/aio-v3.js && node --check dist/aio-v3-runtime.js && node scripts/smoke-runtime-bundle.js && node scripts/smoke-bootstrap.js
      - name: Run Cloudflare control-center checks
        working-directory: v3
        run: npm run check:cloud
      - name: Commit generated browser bundles
        if: github.event_name == 'push'
        shell: bash
        run: |
          git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1
          git ls-files --error-unmatch v3/dist/aio-v3-runtime.js >/dev/null 2>&1
          if git diff --quiet -- v3/dist/aio-v3.js v3/dist/aio-v3-runtime.js; then
            echo 'Bundles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/dist/aio-v3.js v3/dist/aio-v3-runtime.js
          git commit -m 'Build AiO Bot v3 bootstrap and runtime bundles'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify generated bundles on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1
          git ls-files --error-unmatch v3/dist/aio-v3-runtime.js >/dev/null 2>&1
          git diff --exit-code -- v3/dist/aio-v3.js v3/dist/aio-v3-runtime.js
      - name: Diff check
        run: git diff --check
