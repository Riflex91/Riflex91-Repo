name: release-v3-alpha
on:
  push:
    branches: ["v3/**"]
    paths:
      - "v3/**"
      - ".github/workflows/release-v3.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "v3/**"
      - ".github/workflows/release-v3.yml"
permissions:
  contents: write
jobs:
  v3-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require release bump for runtime source changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runtime_changes="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'v3/src/**' ':(exclude)v3/src/release-version.js')"
          if [ -z "$runtime_changes" ]; then
            echo 'No v3 runtime source changes requiring a release bump.'
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- v3/src/release-version.js; then
            echo 'Runtime source changed without updating v3/src/release-version.js:' >&2
            printf '%s\n' "$runtime_changes" >&2
            exit 1
          fi
          base_version="$(git show "$BASE_SHA:v3/version.json" | node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          head_version="$(node -e "process.stdout.write(require('./v3/version.json').version)")"
          node - "$base_version" "$head_version" <<'NODE'
          const [base, head] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^3\.0\.0-alpha\.(\d+)\.(\d+)$/.exec(String(value || ''));
            if (!match) throw new Error(`invalid v3 release version: ${value}`);
            return [Number(match[1]), Number(match[2])];
          };
          const a = parse(base);
          const b = parse(head);
          const newer = b[0] > a[0] || (b[0] === a[0] && b[1] > a[1]);
          if (!newer) {
            console.error(`v3 runtime changed but release version did not increase: ${base} -> ${head}`);
            process.exit(1);
          }
          console.log(`v3 runtime release bump verified: ${base} -> ${head}`);
          NODE
      - name: Install v3 guard dependencies
        working-directory: v3
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Release + Logic Guardian preflight
        working-directory: v3
        run: npm run preflight
      - name: Build and test v3
        working-directory: v3
        run: npm run check:full
      - name: Commit generated browser bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1 && git diff --quiet -- v3/dist/aio-v3.js; then
            echo 'Bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/dist/aio-v3.js
          git commit -m 'Build AiO Bot v3 browser bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify generated bundle on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git ls-files --error-unmatch v3/dist/aio-v3.js >/dev/null 2>&1
          git diff --exit-code -- v3/dist/aio-v3.js
      - name: Diff check
        run: git diff --check
