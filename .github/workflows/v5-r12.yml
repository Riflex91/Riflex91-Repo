name: v5-r12

on:
  pull_request:
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r12-*.mjs'
      - 'v5/werkzeuge/*test-gui*.js'
      - 'v5/werkzeuge/r12-controlled-live-test-paket.js'
      - 'v5/werkzeuge/V5-TEST-GUI.md'
      - 'v5/werkzeuge/tests/r12-test-gui.test.mjs'
      - 'v5/werkzeuge/*test-gui*.js'
      - 'v5/werkzeuge/r12-controlled-live-test-paket.js'
      - 'v5/werkzeuge/V5-TEST-GUI.md'
      - 'v5/werkzeuge/tests/r12-test-gui.test.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r12.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/grundlage/**'
      - 'v5/package.json'
      - 'v5/package-lock.json'
      - 'v5/werkzeuge/r3-*.mjs'
      - 'v5/werkzeuge/tests/r3-*.test.mjs'
      - 'v5/werkzeuge/r12-*.mjs'
      - 'v5/roadmap/**'
      - 'v5/bereitschaft/**'
      - 'v5/anforderungen/**'
      - 'v5/dokumentation/V5-MASTER-ROADMAP.md'
      - '.github/workflows/v5-r12.yml'

permissions:
  contents: read

jobs:
  vertical-slice-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Exakten Head verifizieren
        shell: bash
        run: |
          set -euo pipefail
          ERWARTET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          IST="$(git rev-parse HEAD)"
          test "$IST" = "$ERWARTET"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Gepinnte Abhaengigkeiten installieren
        working-directory: v5
        run: npm ci

      - name: R12 Vertical Slice Shadow pruefen
        working-directory: v5
        run: npm run r12:pruefen
