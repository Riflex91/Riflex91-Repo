name: release-2.15.0-brain-world-model
on:
  push:
    branches:
      - feature/2.15.0-brain-world-model
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair patch bootstrap and apply prepared release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/patch2150.py')
          s=p.read_text()
          s=s.replace('bot,n=parser_old.subn(parser_new,bot,count=1)','bot,n=parser_old.subn(lambda _m: parser_new,bot,count=1)')
          s=s.replace("worker,n=re.subn(r'const DASHBOARD_HTML = [\\s\\S]*?;\\nfunction json\\(',const+'function json(',worker,count=1)","worker,n=re.subn(r'const DASHBOARD_HTML = [\\s\\S]*?;\\s*function json\\(',lambda _m: const+'function json(',worker,count=1)")
          s=s.replace("worker,n=re.subn(r'const DASHBOARD_HTML = [\\s\\S]*?;\\nfunction json\\(',lambda _m: const+'function json(',worker,count=1)","worker,n=re.subn(r'const DASHBOARD_HTML = [\\s\\S]*?;\\s*function json\\(',lambda _m: const+'function json(',worker,count=1)")
          p.write_text(s)
          PY
          python3 .github/patch2150.py
      - name: Bot syntax
        run: node --check bot.js
      - name: Release verifier
        run: node scripts/verify-release.js
      - name: Regression smoke suite
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/smoke*.js; do
            echo "== $f =="
            node "$f"
          done
      - name: Diff hygiene
        run: git diff --check
      - name: Commit tested release and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch2150.py .github/workflows/release-2150.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release 2.15.0: Layered Bot Brain and explainability [release-2150]"
          git push origin HEAD:feature/2.15.0-brain-world-model
