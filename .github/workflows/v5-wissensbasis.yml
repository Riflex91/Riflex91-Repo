name: v5-wissensbasis

on:
  pull_request:
    paths:
      - 'v5/wissensbasis/**'
      - 'v5/werkzeuge/wissensbasis-pruefen.mjs'
      - '.github/workflows/v5-wissensbasis.yml'
  push:
    branches:
      - main
    paths:
      - 'v5/wissensbasis/**'
      - 'v5/werkzeuge/wissensbasis-pruefen.mjs'
      - '.github/workflows/v5-wissensbasis.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V5 Wissensbasis pruefen
        run: node v5/werkzeuge/wissensbasis-pruefen.mjs
