name: v5-wissensbasis

# Manuelle Offline-Diagnose; kein automatisches Funktions-Testgate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-offline-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wissensbasis diagnostizieren
        run: node v5/werkzeuge/wissensbasis-pruefen.mjs
