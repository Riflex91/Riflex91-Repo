name: linux-bridge

on:
  push:
    paths:
      - 'ops/linux-bridge/**'
      - '.github/workflows/linux-bridge.yml'
  pull_request:
    paths:
      - 'ops/linux-bridge/**'
      - '.github/workflows/linux-bridge.yml'

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./ops/linux-bridge/AioBotLinuxBridge.csproj

      - name: Build
        run: dotnet build ./ops/linux-bridge/AioBotLinuxBridge.csproj -c Release --no-restore

      - name: Linux self-test
        if: matrix.rid == 'linux-x64'
        run: dotnet run --project ./ops/linux-bridge/AioBotLinuxBridge.csproj -c Release --no-build -- --self-test

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish ./ops/linux-bridge/AioBotLinuxBridge.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:BridgeBuildNumber=${{ github.run_number }}
          -p:InformationalVersion=1.0.${{ github.run_number }}+${{ github.sha }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o ./artifacts/linux-bridge/${{ matrix.rid }}

      - name: Mark executable
        run: chmod 0755 ./artifacts/linux-bridge/${{ matrix.rid }}/AioBotLinuxBridge

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: AioBotLinuxBridge-${{ matrix.rid }}
          path: ./artifacts/linux-bridge/${{ matrix.rid }}/AioBotLinuxBridge
          if-no-files-found: error

  publish-stable-self-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: linux-bridge-stable-release
      cancel-in-progress: true
    steps:
      - name: Download tested Linux Bridge artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AioBotLinuxBridge-*
          path: ./release

      - name: Publish architecture self-update releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for rid in linux-x64 linux-arm64; do
            dir="./release/AioBotLinuxBridge-$rid"
            bin="$dir/AioBotLinuxBridge"
            manifest="$dir/AioBotLinuxBridge.version.json"
            tag="linux-bridge-latest-$rid"

            chmod 0755 "$bin"
            sha256="$(sha256sum "$bin" | awk '{print $1}')"
            size="$(stat -c '%s' "$bin")"
            published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            asset_url="https://github.com/Riflex91/Riflex91-Repo/releases/download/$tag/AioBotLinuxBridge"

            jq -n               --argjson schemaVersion 1               --argjson buildNumber "${{ github.run_number }}"               --arg version "${{ github.sha }}"               --arg assetUrl "$asset_url"               --arg sha256 "$sha256"               --argjson sizeBytes "$size"               --arg publishedAt "$published_at"               '{schemaVersion:$schemaVersion,buildNumber:$buildNumber,version:$version,assetUrl:$assetUrl,sha256:$sha256,sizeBytes:$sizeBytes,publishedAt:$publishedAt}'               > "$manifest"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi

            gh release create "$tag"               "$bin"               "$manifest"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "AIO Bot Linux Bridge — automatic latest ($rid)"               --notes "Automated, tested Linux Bridge build from commit $GITHUB_SHA (workflow build ${{ github.run_number }})."               --prerelease
          done
