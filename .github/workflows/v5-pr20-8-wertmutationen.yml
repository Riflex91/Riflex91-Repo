      - 'v5/grundlage/tests/pr20-exchange-produktions-planer.test.mjs'
      - 'v5/grundlage/tests/pr20-merchant-remaining-production-preparation.test.mjs'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/package.json'
      - '.github/workflows/v5-pr20-8-wertmutationen.yml'

permissions:
  contents: read

jobs:
  value-mutation-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - run: npm ci
      - run: npm run merchant-pr20-8-prep:pruefen
