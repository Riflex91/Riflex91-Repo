      - 'v5/grundlage/vertraege/runtime/pr20-8-upgrade-durable-shadow-preparation.json'
      - 'v5/grundlage/vertraege/runtime/pr20-8-live-candidate-readonly-preparation.json'
      - 'v5/grundlage/vertraege/runtime/pr20-8-wertmutation-one-shot-preparation.json'
