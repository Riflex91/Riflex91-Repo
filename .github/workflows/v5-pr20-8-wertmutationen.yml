      - 'v5/grundlage/tests/pr20-merchant-remaining-production-preparation.test.mjs'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/package.json'
      - '.github/workflows/v5-pr20-8-wertmutationen.yml'
  pull_request:
    paths:
      - 'v5/grundlage/quelle/merchant/werttransaktion.ts'
      - 'v5/grundlage/quelle/merchant/item-mutations-planer.ts'
      - 'v5/grundlage/quelle/merchant/exchange-produktions-planer.ts'
