permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V5 autonomous test auto-deploy contract
        run: npm run autonomous-test-deploy:pruefen
      - name: Verify PR20.8 recovery runner v1.0.1
        run: node --check werkzeuge/pr20-8-upgrade-productive-one-write-live-v1-0-1.js && node --test werkzeuge/tests/pr20-8-upgrade-productive-one-write-live-v1-0-1.test.mjs
      - name: Verify PR20.8 stale-lease recovery runner v1.0.2
        run: node --check werkzeuge/pr20-8-upgrade-productive-one-write-live-v1-0-2.js && node --test werkzeuge/tests/pr20-8-upgrade-productive-one-write-live-v1-0-2.test.mjs
      - name: Verify PR20.8 item-definition recovery runner v1.0.3
        run: node --check werkzeuge/pr20-8-upgrade-productive-one-write-live-v1-0-3.js && node --test werkzeuge/tests/pr20-8-upgrade-productive-one-write-live-v1-0-3.test.mjs
      - name: Verify PR20.8 updater persistence bootstrap
        run: node --check werkzeuge/pr20-8-updater-recovery-bootstrap-v1.js && node --test werkzeuge/tests/pr20-8-updater-recovery-bootstrap-v1.test.mjs
      - name: Verify PR20.8 updater persistence bootstrap v2 split-context handshake
        run: node --check werkzeuge/pr20-8-updater-recovery-bootstrap-v2.js && node --test werkzeuge/tests/pr20-8-updater-recovery-bootstrap-v2.test.mjs
      - name: Verify PR20.8 minimal bridge handshake probe
        run: node --check werkzeuge/pr20-8-bridge-handshake-probe-v1.js && node --test werkzeuge/tests/pr20-8-bridge-handshake-probe-v1.test.mjs
      - name: Verify PR20.8 terminal bridge handshake probe recovery
        run: node --check werkzeuge/pr20-8-bridge-handshake-probe-v1-0-1.js && node --test werkzeuge/tests/pr20-8-bridge-handshake-probe-v1-0-1.test.mjs
