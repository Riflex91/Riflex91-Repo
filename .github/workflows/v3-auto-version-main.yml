name: v3-auto-version-main

on:
  push:
    branches: ["main"]
    paths:
      - "v3/**"
      - "!v3/README.md"
      - "!v3/docs/**"
      - "!v3/scripts/generate-docs.js"

permissions:
  contents: write

concurrency:
  group: v3-auto-version-main
  cancel-in-progress: false

jobs:
  auto-version:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.publish.outputs.release_sha }}
      release_version: ${{ steps.publish.outputs.release_version }}
      release_bumped: ${{ steps.publish.outputs.release_bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install v3 guard dependencies
        working-directory: v3
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Publish automatic v3 release bump
        id: publish
        shell: bash
        env:
          ORIGINAL_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::group::Automatic version attempt ${attempt}/${max_attempts}"
            git fetch origin main
            git reset --hard origin/main
            base_sha="$(git rev-parse HEAD)"
            from_version="$(node -p "require('./v3/version.json').version")"

            echo "Evaluating latest main ${base_sha} from trigger baseline ${ORIGINAL_BEFORE_SHA}."
            (
              cd v3
              BEFORE_SHA="$ORIGINAL_BEFORE_SHA" AFTER_SHA="$base_sha" GITHUB_OUTPUT='' node scripts/auto-version-on-main.js
            )

            if git diff --quiet -- v3; then
              echo "Latest main already contains the release version for this push; deploying exact main ${base_sha}."
              echo "release_sha=${base_sha}" >> "$GITHUB_OUTPUT"
              echo "release_version=${from_version}" >> "$GITHUB_OUTPUT"
              echo "release_bumped=false" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi

            to_version="$(node -p "require('./v3/version.json').version")"
            git add -u -- v3
            git diff --cached --check
            git commit -m "chore(v3): auto bump release ${from_version} -> ${to_version}"

            # The release checks above are intentionally comprehensive and can take long enough
            # for another merge to land. Never force-push a bump built on stale main.
            git fetch origin main
            latest_sha="$(git rev-parse origin/main)"
            if [ "$latest_sha" != "$base_sha" ]; then
              echo "main advanced from ${base_sha} to ${latest_sha}; discarding this local bump and retrying on latest main."
              echo "::endgroup::"
              continue
            fi

            if git push origin HEAD:main; then
              release_sha="$(git rev-parse HEAD)"
              echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
              echo "release_version=${to_version}" >> "$GITHUB_OUTPUT"
              echo "release_bumped=true" >> "$GITHUB_OUTPUT"
              echo "Published automatic v3 release bump ${from_version} -> ${to_version} at ${release_sha}."
              echo "::endgroup::"
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest main."
            echo "::endgroup::"
          done

          echo "::error::main kept advancing during all ${max_attempts} guarded version attempts; refusing to force-push a stale release bump."
          exit 1

  deploy-release:
    needs: auto-version
    if: needs.auto-version.outputs.release_sha != ''
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      release_sha: ${{ needs.auto-version.outputs.release_sha }}
    secrets: inherit
