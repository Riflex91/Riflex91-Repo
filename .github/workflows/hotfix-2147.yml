name: One-shot 2.14.7 Merchant Bank Item Rules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-2147.yml"
      - "scripts/apply-2.14.7-merchant-bank-item-rules.py"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 2.14.7 hotfix
        run: python scripts/apply-2.14.7-merchant-bank-item-rules.py
      - name: JavaScript syntax
        run: node --check bot.js
      - name: Release contract
        run: node scripts/verify-release.js
      - name: Merchant stability smoke
        run: node scripts/smoke-merchant-stability.js
      - name: 2.14.4 retained regression smoke
        run: node scripts/smoke-2144-merchant-party-ui.js
      - name: 2.14.5 retained regression smoke
        run: node scripts/smoke-2145-merchant-path-dashboard-ui.js
      - name: 2.14.6 retained regression smoke
        run: node scripts/smoke-2146-merchant-update-button.js
      - name: 2.14.7 Merchant bank/item rules smoke
        run: node scripts/smoke-2147-merchant-bank-item-rules.js
      - name: Student smoke
        run: node scripts/smoke-student.js
      - name: Champion Challenger smoke
        run: node scripts/smoke-league.js
      - name: Brain Diary smoke
        run: node scripts/smoke-diary.js
      - name: Learning Quality smoke
        run: node scripts/smoke-quality.js
      - name: Research Bridge smoke
        run: node scripts/smoke-research.js
      - name: Cloudflare Worker smoke
        run: node scripts/smoke-worker.mjs
      - name: Publish 2.14.7 if tests passed
        run: |
          git config user.name "Riflex91"
          git config user.email "hansijuergenlul@gmail.com"
          git add bot.js version.json README.md BOT_README.md scripts/verify-release.js scripts/smoke-merchant-stability.js scripts/smoke-2144-merchant-party-ui.js scripts/smoke-2145-merchant-path-dashboard-ui.js scripts/smoke-2146-merchant-update-button.js scripts/smoke-2147-merchant-bank-item-rules.js
          git commit -m "Release 2.14.7: Merchant bank race and item rules"
          git push origin main
