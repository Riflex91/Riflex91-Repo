name: v5-bank-pr20-2-exit-gate

on:
  pull_request:
    paths:
      - 'v5/roadmap/pr20-2-bank-deposit-production-evidence.json'
      - 'v5/roadmap/pr20-2-bank-direct-ingame-function-evidence.json'
      - 'v5/roadmap/pr20-2-bank-withdraw-two-test-limit-bridge-evidence.json'
      - 'v5/roadmap/pr20-2-bank-open-pack-shadow-evidence.json'
      - 'v5/roadmap/pr20-2-bank-open-pack-admission-evidence.json'
      - 'v5/roadmap/pr20-2-bank-no-write-5m-evidence.json'
      - 'v5/roadmap/pr20-2-bank-blocker-closeout.json'
      - 'v5/roadmap/pr20-2-bank-exit-gate-status.json'
      - 'v5/roadmap/post-r19-roadmap.json'
      - 'v5/werkzeuge/pr20-2-bank-exit-gate-pruefen.mjs'
      - 'v5/grundlage/tests/pr20-bank-exit-gate-status.test.mjs'
      - 'v5/grundlage/tests/pr20-bank-no-write-5m-evidence.test.mjs'
      - 'v5/dokumentation/PR20-2-BANK-PRODUKTIV-VORBEREITUNG.md'
      - 'v5/dokumentation/V5-POST-R19-ROADMAP.md'
      - 'v5/package.json'
      - '.github/workflows/v5-bank-pr20-2-exit-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-exit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v5/package-lock.json
      - working-directory: v5
        run: npm ci
      - working-directory: v5
        run: npm run bank-pr20-2-exit-gate:pruefen
