name: v4-grundlage-pruefen

on:
  push:
    paths:
      - 'v4/**'
      - '.github/workflows/v4-pruefung.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'v4/**'
      - '.github/workflows/v4-pruefung.yml'

permissions:
  contents: read

jobs:
  v4-pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V4-Abhaengigkeiten installieren
        working-directory: v4
        run: npm install --ignore-scripts
      - name: Typen, Tests, Namen und Struktur pruefen
        working-directory: v4
        run: npm run pruefen
