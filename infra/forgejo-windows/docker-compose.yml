name: aio-forgejo-local

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.8
    container_name: aio-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__server__ROOT_URL: "http://localhost:3000/"
      FORGEJO__server__SSH_DOMAIN: "localhost"
      FORGEJO__server__SSH_PORT: "2222"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - forgejo-data:/data

  bridge:
    profiles: ["bridge"]
    build:
      context: ./bridge
    container_name: aio-forgejo-bridge
    restart: unless-stopped
    depends_on:
      - forgejo
    env_file:
      - .env.bridge
    environment:
      PORT: "8788"
      FORGEJO_URL: "http://forgejo:3000"
    ports:
      - "127.0.0.1:8788:8788"

volumes:
  forgejo-data:
    name: aio-forgejo-data
